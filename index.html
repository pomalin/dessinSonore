<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dessin Sonore — V1.7 Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header { background: #242424; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
    header h1 { font-size: 1.1rem; color: #fff; }
    header span { font-size: 0.8rem; color: #888; }

    .main-layout { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
    @media (min-width: 900px) { .main-layout { flex-direction: row; } }

    .workspace { flex: 1; display: flex; flex-direction: column; background: #121212; padding: 10px; gap: 10px; overflow: hidden; }
    
    .tabs { display: flex; background: #252525; border-radius: 6px; padding: 3px; gap: 3px; }
    .tab-btn { flex: 1; padding: 8px; background: transparent; border: none; color: #aaa; font-weight: bold; cursor: pointer; border-radius: 4px; }
    .tab-btn.active { background: #3a3a3a; color: #fff; }

    .canvas-container { flex: 1; background: #000; border-radius: 6px; position: relative; border: 1px solid #333; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #202020; border-bottom: 1px solid #333; gap: 10px; }
    
    /* Touch-action restreint STRICTEMENT au canvas */
    canvas.paint-area { flex: 1; width: 100%; height: 100%; background: #ffffff; cursor: crosshair; touch-action: none; }

    .sidebar { width: 100%; background: #222; padding: 15px; border-left: 1px solid #333; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    @media (min-width: 900px) { .sidebar { width: 360px; } }

    .section-title { font-size: 0.8rem; font-weight: bold; color: #1976d2; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; border-bottom: 1px solid #333; padding-bottom: 4px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .control { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8rem; color: #bbb; display: flex; justify-content: space-between; }
    input[type="range"] { accent-color: #1976d2; width: 100%; }
    
    /* Formulaires explicitement interactifs */
    select, input[type="number"] { 
      background: #333; 
      border: 1px solid #555; 
      color: #fff; 
      padding: 10px; 
      border-radius: 6px; 
      font-size: 1rem; 
      width: 100%;
      -webkit-appearance: menulist;
      appearance: menulist;
    }

    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: #ccc; }
    .checkbox-label input { width: 18px; height: 18px; accent-color: #1976d2; }

    .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    button.action-btn { padding: 12px 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #333; color: #fff; font-size: 0.85rem; }
    button.primary { background: #2e7d32; }
    button.danger { background: #c62828; }
    button.secondary { background: #1565c0; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: #222; border-radius: 8px; padding: 15px; width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444; }
  </style>
</head>
<body>

  <header>
    <h1>DESSIN SONORE — V1.7</h1>
    <span id="audio-indicator">🔇 Audio: En attente</span>
  </header>

  <div class="main-layout">
    
    <div class="workspace">
      <div class="tabs">
        <button class="tab-btn active" id="tab-draw-btn">🎨 Dessiner</button>
        <button class="tab-btn" id="tab-import-btn">🖼 Importer</button>
      </div>

      <div id="draw-view" class="canvas-container">
        <div class="toolbar">
          <div style="display:flex; align-items:center; gap: 8px; flex: 1; max-width: 250px;">
            <label style="white-space:nowrap; margin:0;">Épaisseur :</label>
            <input type="range" id="brush-size" min="1" max="25" value="6">
            <span id="brush-val" style="font-size:0.8rem;">6</span>
          </div>
          <button class="action-btn" id="btn-clear">⌫ Effacer</button>
        </div>
        <canvas id="paintCanvas" class="paint-area"></canvas>
      </div>

      <div id="import-view" class="canvas-container" style="display:none;">
        <div class="toolbar">
          <input type="file" id="file-input" accept="image/*" style="display:none;">
          <button class="action-btn secondary" id="btn-browse">📂 Importer une image</button>
        </div>
        <canvas id="importCanvas" class="paint-area"></canvas>
      </div>
    </div>

    <div class="sidebar">
      <div>
        <div class="section-title">🌓 Traitement de l'image</div>
        <div class="control" style="margin-bottom: 8px;">
          <label>Contraste : <span id="contrast-val">1.00</span></label>
          <input type="range" id="contrast" min="0.1" max="3.0" value="1.0" step="0.05">
        </div>
        <div class="control" style="margin-bottom: 12px;">
          <label>Luminosité : <span id="brightness-val">1.00</span></label>
          <input type="range" id="brightness" min="0.1" max="3.0" value="1.0" step="0.05">
        </div>
        <div class="grid-2">
          <label class="checkbox-label">
            <input type="checkbox" id="invert-bw"> Inverser N/B
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="invert-freq"> Inverser Fréq.
          </label>
        </div>
      </div>

      <div>
        <div class="section-title">🔊 Sonification</div>
        
        <div class="control" style="margin-bottom: 10px;">
          <label for="engine-select">Moteur de synthèse</label>
          <select id="engine-select">
            <option value="spectral">Spectral (ANS)</option>
            <option value="mclaren">McLaren</option>
            <option value="density">Variable Density</option>
          </select>
        </div>

        <div class="control" style="margin-bottom: 10px;">
          <label>Durée (s) : <span id="duration-val">4</span>s</label>
          <input type="range" id="duration" min="0.5" max="12" value="4" step="0.5">
        </div>

        <div id="ans-controls">
          <div class="grid-2" style="margin-bottom: 8px;">
            <div class="control">
              <label>Freq min (Hz)</label>
              <input type="number" id="fmin" value="80">
            </div>
            <div class="control">
              <label>Freq max (Hz)</label>
              <input type="number" id="fmax" value="4000">
            </div>
          </div>
          <div class="control">
            <label>Résolution fréq. : <span id="bins-val">40</span></label>
            <input type="range" id="nbins" min="20" max="100" value="40">
          </div>
        </div>

        <div id="mclaren-controls" style="display:none;">
          <div class="control">
            <label>Fréquence de base (Hz)</label>
            <input type="number" id="mclaren-freq" value="220">
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">Actions</div>
        <div class="btn-group" style="margin-bottom: 8px;">
          <button class="action-btn primary" id="btn-play">▶ Écouter</button>
          <button class="action-btn danger" id="btn-stop">■ Stop</button>
          <button class="action-btn secondary" id="btn-spectrogram">📊 Voir</button>
        </div>
      </div>

      <div id="status-bar" style="font-size:0.75rem; color:#888; margin-top:auto;">Prêt.</div>
    </div>

  </div>

  <div class="modal" id="modal-spectro">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Spectrogramme du son généré</h3>
        <button class="action-btn danger" id="btn-close-modal">✕ Fermer</button>
      </div>
      <canvas id="spectroCanvas" style="height: 250px; background:#000;"></canvas>
    </div>
  </div>

  <script>
    // --- GESTION AUDIO UNIVERSELLE (MOBILE) ---
    let audioCtx = null;
    let currentSource = null;
    let lastAudioBuffer = null;

    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().then(() => {
          document.getElementById('audio-indicator').textContent = "🔊 Audio: Prêt";
        });
      } else {
        document.getElementById('audio-indicator').textContent = "🔊 Audio: Prêt";
      }
    }

    // Débloque l'audio sur n'importe quelle interaction
    window.addEventListener('touchstart', unlockAudio, { once: true });
    window.addEventListener('click', unlockAudio, { once: true });

    // --- CANVAS & DESSIN ---
    const paintCanvas = document.getElementById('paintCanvas');
    const pCtx = paintCanvas.getContext('2d', { willReadFrequently: true });
    
    const importCanvas = document.getElementById('importCanvas');
    const iCtx = importCanvas.getContext('2d', { willReadFrequently: true });

    let activeTab = 'draw';
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function initCanvas() {
      const pRect = paintCanvas.parentElement.getBoundingClientRect();
      paintCanvas.width = pRect.width;
      paintCanvas.height = pRect.height - 45;
      pCtx.fillStyle = "#ffffff";
      pCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);

      const iRect = importCanvas.parentElement.getBoundingClientRect();
      importCanvas.width = iRect.width;
      importCanvas.height = iRect.height - 45;
      iCtx.fillStyle = "#111111";
      iCtx.fillRect(0, 0, importCanvas.width, importCanvas.height);
    }
    window.addEventListener('resize', initCanvas);
    setTimeout(initCanvas, 100);

    // Onglets
    document.getElementById('tab-draw-btn').onclick = () => {
      activeTab = 'draw';
      document.getElementById('draw-view').style.display = 'flex';
      document.getElementById('import-view').style.display = 'none';
      document.getElementById('tab-draw-btn').classList.add('active');
      document.getElementById('tab-import-btn').classList.remove('active');
    };

    document.getElementById('tab-import-btn').onclick = () => {
      activeTab = 'import';
      document.getElementById('draw-view').style.display = 'none';
      document.getElementById('import-view').style.display = 'flex';
      document.getElementById('tab-import-btn').classList.add('active');
      document.getElementById('tab-draw-btn').classList.remove('active');
    };

    const brushSlider = document.getElementById('brush-size');
    brushSlider.oninput = (e) => document.getElementById('brush-val').textContent = e.target.value;

    function getPos(e, canvas) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    paintCanvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e, paintCanvas); lastX = p.x; lastY = p.y; });
    paintCanvas.addEventListener('touchstart', (e) => { isDrawing = true; const p = getPos(e, paintCanvas); lastX = p.x; lastY = p.y; }, { passive: true });

    function draw(e) {
      if (!isDrawing) return;
      const p = getPos(e, paintCanvas);
      pCtx.beginPath();
      pCtx.moveTo(lastX, lastY);
      pCtx.lineTo(p.x, p.y);
      pCtx.strokeStyle = "#000000";
      pCtx.lineWidth = brushSlider.value;
      pCtx.lineCap = "round";
      pCtx.stroke();
      lastX = p.x; lastY = p.y;
    }

    paintCanvas.addEventListener('mousemove', draw);
    paintCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });

    window.addEventListener('mouseup', () => isDrawing = false);
    window.addEventListener('touchend', () => isDrawing = false);

    document.getElementById('btn-clear').onclick = () => {
      pCtx.fillStyle = "#ffffff";
      pCtx.fillRect(0, 0, paintCanvas.width, paintCanvas.height);
    };

    // Importer
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-browse').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => iCtx.drawImage(img, 0, 0, importCanvas.width, importCanvas.height);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // Formulaires & Sliders
    document.getElementById('contrast').oninput = (e) => document.getElementById('contrast-val').textContent = parseFloat(e.target.value).toFixed(2);
    document.getElementById('brightness').oninput = (e) => document.getElementById('brightness-val').textContent = parseFloat(e.target.value).toFixed(2);
    document.getElementById('duration').oninput = (e) => document.getElementById('duration-val').textContent = e.target.value;
    document.getElementById('nbins').oninput = (e) => document.getElementById('bins-val').textContent = e.target.value;

    const engineSelect = document.getElementById('engine-select');
    engineSelect.addEventListener('change', (e) => {
      const val = e.target.value;
      document.getElementById('ans-controls').style.display = val === 'spectral' ? 'block' : 'none';
      document.getElementById('mclaren-controls').style.display = val === 'mclaren' ? 'block' : 'none';
    });

    // Moteur Audio
    function getActiveImageData() {
      const cv = activeTab === 'draw' ? paintCanvas : importCanvas;
      const ctx = activeTab === 'draw' ? pCtx : iCtx;
      const imgData = ctx.getImageData(0, 0, cv.width, cv.height);
      
      const data = imgData.data;
      const contrast = parseFloat(document.getElementById('contrast').value);
      const brightness = parseFloat(document.getElementById('brightness').value);
      const invertBW = document.getElementById('invert-bw').checked;

      const processed = new Float32Array(cv.width * cv.height);
      for (let i = 0; i < data.length; i += 4) {
        let gray = (data[i] + data[i+1] + data[i+2]) / 3;
        gray = ((gray - 128) * contrast + 128) * brightness;
        gray = Math.max(0, Math.min(255, gray));
        let val = gray / 255.0;
        if (invertBW) val = 1.0 - val;
        processed[i / 4] = val;
      }
      return { data: processed, w: cv.width, h: cv.height };
    }

    function generateAudio() {
      unlockAudio();
      
      const { data, w, h } = getActiveImageData();
      const duration = parseFloat(document.getElementById('duration').value);
      const sampleRate = audioCtx.sampleRate;
      const totalSamples = Math.floor(sampleRate * duration);
      const engine = engineSelect.value;
      const invertFreq = document.getElementById('invert-freq').checked;

      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const channel = buffer.getChannelData(0);

      if (engine === 'spectral') {
        const fmin = parseFloat(document.getElementById('fmin').value) || 80;
        const fmax = parseFloat(document.getElementById('fmax').value) || 4000;
        const nBins = parseInt(document.getElementById('nbins').value) || 40;

        for (let b = 0; b < nBins; b++) {
          let binIndex = invertFreq ? (nBins - 1 - b) : b;
          let freq = fmin * Math.pow(fmax / fmin, binIndex / nBins);
          let y = Math.floor((1 - binIndex / nBins) * (h - 1));

          for (let i = 0; i < totalSamples; i++) {
            let x = Math.floor((i / totalSamples) * (w - 1));
            let amp = 1.0 - data[y * w + x];
            if (amp > 0.05) {
              channel[i] += Math.sin(2 * Math.PI * freq * (i / sampleRate)) * amp * 0.03;
            }
          }
        }
      } 
      else if (engine === 'mclaren') {
        const baseFreq = parseFloat(document.getElementById('mclaren-freq').value) || 220;
        let phase = 0;
        for (let i = 0; i < totalSamples; i++) {
          let x = Math.floor((i / totalSamples) * (w - 1));
          let columnCenter = 0, totalWeight = 0;
          for (let y = 0; y < h; y++) {
            let ink = 1.0 - data[y * w + x];
            columnCenter += y * ink;
            totalWeight += ink;
          }
          let centroid = totalWeight > 0 ? (columnCenter / totalWeight) : (h / 2);
          let normY = (h / 2 - centroid) / (h / 2);
          if (invertFreq) normY = -normY;

          let instFreq = baseFreq * Math.pow(2, normY);
          phase += (2 * Math.PI * instFreq) / sampleRate;
          channel[i] = Math.sin(phase) * (totalWeight > 0.5 ? 0.7 : 0);
        }
      } 
      else {
        for (let i = 0; i < totalSamples; i++) {
          let x = Math.floor((i / totalSamples) * (w - 1));
          let sum = 0;
          for (let y = 0; y < h; y++) sum += data[y * w + x];
          let density = sum / h;
          channel[i] = (Math.random() * 2 - 1) * (1.0 - density);
        }
      }

      let maxAmp = 0;
      for (let i = 0; i < totalSamples; i++) maxAmp = Math.max(maxAmp, Math.abs(channel[i]));
      if (maxAmp > 0) {
        for (let i = 0; i < totalSamples; i++) channel[i] = (channel[i] / maxAmp) * 0.85;
      }

      lastAudioBuffer = buffer;
      return buffer;
    }

    document.getElementById('btn-play').onclick = () => {
      unlockAudio();
      if (currentSource) currentSource.stop();
      const buffer = generateAudio();
      currentSource = audioCtx.createBufferSource();
      currentSource.buffer = buffer;
      currentSource.connect(audioCtx.destination);
      currentSource.start();
      document.getElementById('status-bar').textContent = "▶ Lecture en cours…";
    };

    document.getElementById('btn-stop').onclick = () => {
      if (currentSource) currentSource.stop();
      document.getElementById('status-bar').textContent = "■ Arrêté.";
    };

    const modal = document.getElementById('modal-spectro');
    document.getElementById('btn-spectrogram').onclick = () => {
      if (!lastAudioBuffer) generateAudio();
      modal.style.display = "flex";
      
      const canvas = document.getElementById('spectroCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth - 30;
      canvas.height = 250;

      const data = lastAudioBuffer.getChannelData(0);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#1976d2";
      const step = Math.ceil(data.length / canvas.width);
      const amp = canvas.height / 2;

      for (let i = 0; i < canvas.width; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          let datum = data[(i * step) + j];
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
        ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }
    };
    document.getElementById('btn-close-modal').onclick = () => modal.style.display = "none";
  </script>
</body>
</html>
