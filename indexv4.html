
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dessin Sonore — V3</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #181818;
    color: #dedede;
}

/* =========================================================
   HEADER
========================================================= */

header {
    height: 54px;
    background: #202020;
    border-bottom: 1px solid #383838;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
}

header h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 1.5px;
    color: #f2f2f2;
}

.audio-state {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #aaa;
}

.audio-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #777;
}

.audio-dot.ready {
    background: #6eaa78;
}

.audio-dot.playing {
    background: #4d9bc8;
    box-shadow: 0 0 8px rgba(77,155,200,.6);
}

/* =========================================================
   LAYOUT
========================================================= */

.main-layout {
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 54px);
}

.workspace {
    flex: 1;
    min-width: 0;
    padding: 12px;
    background: #121212;
}

.sidebar {
    background: #202020;
    border-top: 1px solid #353535;
    padding: 16px;
}

@media (min-width: 900px) {

    .main-layout {
        flex-direction: row;
        height: calc(100vh - 54px);
    }

    .workspace {
        height: 100%;
    }

    .sidebar {
        width: 350px;
        min-width: 350px;
        height: 100%;
        overflow-y: auto;
        border-top: none;
        border-left: 1px solid #353535;
    }
}

/* =========================================================
   DRAWING AREA
========================================================= */

.canvas-container {
    height: 100%;
    min-height: 420px;
    background: #050505;
    border: 1px solid #383838;
    border-radius: 7px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
}

.toolbar {
    min-height: 48px;
    padding: 7px 10px;
    background: #242424;
    border-bottom: 1px solid #373737;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.brush-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 170px;
}

.toolbar label {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
}

.toolbar input[type="range"] {
    flex: 1;
}

#brush-val {
    width: 24px;
    text-align: right;
    color: #ccc;
    font-size: 12px;
}

canvas.paint-area {
    width: 100%;
    height: 100%;
    flex: 1;
    display: block;
    background: white;
    touch-action: none;
    cursor: crosshair;
}

/* =========================================================
   BUTTONS
========================================================= */

button {
    font-family: inherit;
}

.action-btn {
    border: 1px solid #484848;
    border-radius: 5px;
    padding: 9px 11px;
    background: #303030;
    color: #eee;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
}

.action-btn:hover {
    background: #3a3a3a;
    border-color: #5a5a5a;
}

.action-btn:active {
    transform: translateY(1px);
}

.action-btn:disabled {
    opacity: .35;
    cursor: default;
}

.primary {
    background: #315f3a;
    border-color: #487b52;
}

.primary:hover {
    background: #397044;
}

.danger {
    background: #653737;
    border-color: #824848;
}

.secondary {
    background: #2d5068;
    border-color: #416d89;
}

.small-btn {
    padding: 7px 9px;
    font-size: 11px;
}

/* =========================================================
   SECTIONS
========================================================= */

.section {
    margin-bottom: 22px;
}

.section-title {
    color: #8db5cc;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding-bottom: 7px;
    margin-bottom: 11px;
    border-bottom: 1px solid #383838;
}

.control {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 12px;
}

label {
    color: #aaa;
    font-size: 12px;
}

.value {
    float: right;
    color: #ddd;
    font-variant-numeric: tabular-nums;
}

.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

/* =========================================================
   INPUTS
========================================================= */

input[type="range"] {
    width: 100%;
    accent-color: #6999b5;
    height: 24px;
}

input[type="number"],
select {
    width: 100%;
    padding: 9px 10px;
    background: #303030;
    color: #eee;
    border: 1px solid #494949;
    border-radius: 5px;
    font-size: 13px;
    outline: none;
}

input[type="number"]:focus,
select:focus {
    border-color: #6b92a8;
}

.checkbox-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #aaa;
    font-size: 12px;
}

.checkbox-label input {
    width: 17px;
    height: 17px;
    accent-color: #6999b5;
}

/* =========================================================
   ENGINE DESCRIPTION
========================================================= */

.engine-description {
    min-height: 40px;
    margin-top: 7px;
    padding: 8px 9px;
    background: #292929;
    border-left: 2px solid #496b7c;
    color: #999;
    font-size: 11px;
    line-height: 1.45;
}

/* =========================================================
   ACTIONS
========================================================= */

.action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

.export-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 7px;
}

/* =========================================================
   STATUS
========================================================= */

.status {
    color: #888;
    font-size: 11px;
    line-height: 1.5;
    min-height: 18px;
}

.progress-container {
    height: 2px;
    background: #333;
    margin-top: 7px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #6b96ad;
    transition: width .1s linear;
}

/* =========================================================
   SCAN LINE
========================================================= */

.scan-line {
    position: absolute;
    top: 48px;
    bottom: 0;
    width: 1px;
    background: rgba(60,130,170,.75);
    box-shadow: 0 0 8px rgba(60,130,170,.5);
    pointer-events: none;
    display: none;
}

/* =========================================================
   MODAL
========================================================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.88);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal.visible {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 900px;
    background: #202020;
    border: 1px solid #454545;
    border-radius: 7px;
    padding: 15px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.modal-header h2 {
    font-size: 14px;
    font-weight: 500;
}

#spectroCanvas {
    width: 100%;
    height: 300px;
    display: block;
    background: #000;
    border: 1px solid #333;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 899px) {

    .canvas-container {
        height: 55vh;
        min-height: 320px;
    }

    .workspace {
        min-height: 0;
    }

    .action-btn {
        min-height: 36px;
    }

    header h1 {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>
    <h1>DESSIN SONORE — V3</h1>

    <div class="audio-state">
        <span class="audio-dot ready" id="audio-dot"></span>
        <span id="audio-indicator">AUDIO : PRÊT</span>
    </div>
</header>


<div class="main-layout">

    <main class="workspace">

        <div class="canvas-container">

            <div class="toolbar">

                <div class="brush-control">

                    <label>Épaisseur</label>

                    <input
                        type="range"
                        id="brush-size"
                        min="1"
                        max="40"
                        value="6">

                    <span id="brush-val">6</span>

                </div>

                <input
                    type="file"
                    id="file-input"
                    accept="image/*"
                    hidden>

                <button
                    type="button"
                    class="action-btn secondary"
                    id="btn-browse">
                    Importer
                </button>

                <button
                    type="button"
                    class="action-btn small-btn"
                    id="btn-undo">
                    ↶
                </button>

                <button
                    type="button"
                    class="action-btn small-btn"
                    id="btn-redo">
                    ↷
                </button>

                <button
                    type="button"
                    class="action-btn danger"
                    id="btn-clear">
                    Effacer
                </button>

            </div>

            <canvas
                id="paintCanvas"
                width="800"
                height="600"
                class="paint-area">
            </canvas>

            <div
                class="scan-line"
                id="scan-line">
            </div>

        </div>

    </main>


    <aside class="sidebar">

        <!-- IMAGE -->

        <section class="section">

            <div class="section-title">
                Image
            </div>

            <div class="control">

                <label>
                    Contraste
                    <span
                        class="value"
                        id="contrast-val">
                        1.00
                    </span>
                </label>

                <input
                    type="range"
                    id="contrast"
                    min="0.1"
                    max="3"
                    value="1"
                    step="0.05">

            </div>

            <div class="control">

                <label>
                    Luminosité
                    <span
                        class="value"
                        id="brightness-val">
                        1.00
                    </span>
                </label>

                <input
                    type="range"
                    id="brightness"
                    min="0.1"
                    max="3"
                    value="1"
                    step="0.05">

            </div>

            <div class="checkbox-row">

                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        id="invert-bw">
                    Inverser N/B
                </label>

                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        id="invert-freq">
                    Inverser fréq.
                </label>

            </div>

        </section>


        <!-- SONIFICATION -->

        <section class="section">

            <div class="section-title">
                Sonification
            </div>

            <div class="control">

                <label for="engine-select">
                    Moteur
                </label>

                <select id="engine-select">

                    <option value="spectral">
                        Spectral (ANS)
                    </option>

                    <option value="mclaren">
                        McLaren
                    </option>

                    <option value="density">
                        Variable Density
                    </option>

                </select>

                <div
                    class="engine-description"
                    id="engine-description">
                    Le dessin est analysé comme un ensemble de
                    composantes fréquentielles réparties verticalement.
                </div>

            </div>


            <div class="control">

                <label>

                    Durée

                    <span class="value">
                        <span id="duration-val">
                            4
                        </span>
                        s
                    </span>

                </label>

                <input
                    type="range"
                    id="duration"
                    min="0.5"
                    max="60"
                    value="4"
                    step="0.5">

            </div>


            <div id="ans-controls">

                <div class="grid-2">

                    <div class="control">

                        <label>
                            Fréq. min
                        </label>

                        <input
                            type="number"
                            id="fmin"
                            min="20"
                            max="20000"
                            value="80">

                    </div>

                    <div class="control">

                        <label>
                            Fréq. max
                        </label>

                        <input
                            type="number"
                            id="fmax"
                            min="20"
                            max="20000"
                            value="4000">

                    </div>

                </div>

                <div class="control">

                    <label>

                        Résolution fréquentielle

                        <span
                            class="value"
                            id="bins-val">
                            40
                        </span>

                    </label>

                    <input
                        type="range"
                        id="nbins"
                        min="10"
                        max="100"
                        value="40">

                </div>

            </div>


            <div
                id="mclaren-controls"
                style="display:none;">

                <div class="control">

                    <label>
                        Fréquence de base
                    </label>

                    <input
                        type="number"
                        id="mclaren-freq"
                        min="20"
                        max="5000"
                        value="220">

                </div>

            </div>

        </section>


        <!-- ECOUTE -->

        <section class="section">

            <div class="section-title">
                Écoute
            </div>

            <div class="action-grid">

                <button
                    type="button"
                    class="action-btn primary"
                    id="btn-play">
                    ▶ Jouer
                </button>

                <button
                    type="button"
                    class="action-btn danger"
                    id="btn-stop">
                    ■ Stop
                </button>

                <button
                    type="button"
                    class="action-btn secondary"
                    id="btn-spectrogram">
                    Voir
                </button>

            </div>

        </section>


        <!-- EXPORT -->

        <section class="section">

            <div class="section-title">
                Exporter
            </div>

            <div class="export-grid">

                <button
                    type="button"
                    class="action-btn"
                    id="btn-export-png">
                    PNG
                </button>

                <button
                    type="button"
                    class="action-btn"
                    id="btn-export-wav">
                    WAV
                </button>

            </div>

        </section>


        <div
            class="status"
            id="status-bar">
            Prêt. Dessinez, importez une image,
            ou modifiez les paramètres.
        </div>

        <div class="progress-container">
            <div
                class="progress"
                id="progress">
            </div>
        </div>

    </aside>

</div>


<!-- =========================================================
     MODAL ANALYSE
========================================================= -->

<div
    class="modal"
    id="modal-spectro">

    <div class="modal-content">

        <div class="modal-header">

            <h2>
                Analyse fréquentielle
            </h2>

            <button
                type="button"
                class="action-btn danger"
                id="btn-close-modal">
                Fermer
            </button>

        </div>

        <canvas
            id="spectroCanvas">
        </canvas>

    </div>

</div>


<script>
"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const paintCanvas =
    document.getElementById("paintCanvas");

const pCtx =
    paintCanvas.getContext(
        "2d",
        { willReadFrequently: true }
    );

const rawCanvas =
    document.createElement("canvas");

rawCanvas.width =
    paintCanvas.width;

rawCanvas.height =
    paintCanvas.height;

const rawCtx =
    rawCanvas.getContext(
        "2d",
        { willReadFrequently: true }
    );


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let currentSource = null;
let lastAudioBuffer = null;
let lastSettingsSignature = null;

let playbackStartTime = 0;
let playbackDuration = 0;
let animationFrame = null;


async function initAudio() {

    if (!audioCtx) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        audioCtx =
            new AudioContext();

    }

    if (
        audioCtx.state === "suspended"
    ) {

        await audioCtx.resume();

    }

}


/* =========================================================
   ETAT AUDIO
========================================================= */

function setAudioState(state) {

    const dot =
        document.getElementById(
            "audio-dot"
        );

    const indicator =
        document.getElementById(
            "audio-indicator"
        );

    dot.className =
        "audio-dot " +
        (
            state === "playing"
                ? "playing"
                : "ready"
        );

    indicator.textContent =
        state === "playing"
            ? "AUDIO : LECTURE"
            : "AUDIO : PRÊT";

}


/* =========================================================
   UTILITAIRES
========================================================= */

function setStatus(text) {

    document.getElementById(
        "status-bar"
    ).textContent = text;

}


function setProgress(value) {

    document.getElementById(
        "progress"
    ).style.width =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        ) + "%";

}


function invalidateAudio() {

    lastAudioBuffer = null;
    lastSettingsSignature = null;

}


/* =========================================================
   EFFACEMENT
========================================================= */

/*
 * Fonction d'effacement centrale.
 *
 * Elle ne dépend d'aucun filtre, d'aucun moteur
 * et d'aucun état précédent.
 *
 * Les deux canvases sont explicitement remis
 * en blanc.
 */

function eraseDrawing() {

    stopPlayback(false);

    pCtx.clearRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );

    rawCtx.clearRect(
        0,
        0,
        rawCanvas.width,
        rawCanvas.height
    );

    pCtx.fillStyle = "#ffffff";

    pCtx.fillRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );

    rawCtx.fillStyle = "#ffffff";

    rawCtx.fillRect(
        0,
        0,
        rawCanvas.width,
        rawCanvas.height
    );

    invalidateAudio();

    undoStack.length = 0;
    redoStack.length = 0;

    updateUndoRedo();

    setProgress(0);

    setStatus(
        "Dessin effacé."
    );

}


/* =========================================================
   INITIALISATION CANVAS
========================================================= */

eraseDrawing();


/* =========================================================
   DESSIN
========================================================= */

let isDrawing = false;
let lastX = 0;
let lastY = 0;
let historySavedForStroke = false;

const brushSlider =
    document.getElementById(
        "brush-size"
    );


brushSlider.addEventListener(
    "input",
    () => {

        document.getElementById(
            "brush-val"
        ).textContent =
            brushSlider.value;

    }
);


function getPosition(event) {

    const rect =
        paintCanvas.getBoundingClientRect();

    return {

        x:
            (event.clientX - rect.left) *
            paintCanvas.width /
            rect.width,

        y:
            (event.clientY - rect.top) *
            paintCanvas.height /
            rect.height

    };

}


function startDrawing(event) {

    if (
        event.pointerType === "mouse" &&
        event.button !== 0
    ) {
        return;
    }

    if (!historySavedForStroke) {

        saveHistory();

        historySavedForStroke =
            true;

    }

    try {

        paintCanvas.setPointerCapture(
            event.pointerId
        );

    } catch (e) {}

    isDrawing = true;

    const p =
        getPosition(event);

    lastX = p.x;
    lastY = p.y;

    drawPoint(
        p.x,
        p.y
    );

}


function drawPoint(x, y) {

    const size =
        parseFloat(
            brushSlider.value
        );

    [pCtx, rawCtx].forEach(
        ctx => {

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                size / 2,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#000000";

            ctx.fill();

        }
    );

}


function draw(event) {

    if (!isDrawing) return;

    const p =
        getPosition(event);

    const size =
        parseFloat(
            brushSlider.value
        );

    [pCtx, rawCtx].forEach(
        ctx => {

            ctx.beginPath();

            ctx.moveTo(
                lastX,
                lastY
            );

            ctx.lineTo(
                p.x,
                p.y
            );

            ctx.strokeStyle =
                "#000000";

            ctx.lineWidth =
                size;

            ctx.lineCap =
                "round";

            ctx.lineJoin =
                "round";

            ctx.stroke();

        }
    );

    lastX = p.x;
    lastY = p.y;

}


function stopDrawing(event) {

    if (!isDrawing) return;

    isDrawing = false;

    try {

        paintCanvas.releasePointerCapture(
            event.pointerId
        );

    } catch (e) {}

    historySavedForStroke =
        false;

    applyFilters();

    invalidateAudio();

}


paintCanvas.addEventListener(
    "pointerdown",
    startDrawing
);

paintCanvas.addEventListener(
    "pointermove",
    draw
);

paintCanvas.addEventListener(
    "pointerup",
    stopDrawing
);

paintCanvas.addEventListener(
    "pointercancel",
    stopDrawing
);


/* =========================================================
   HISTORIQUE
========================================================= */

const undoStack = [];
const redoStack = [];

const MAX_HISTORY = 20;


function saveHistory() {

    const image =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    undoStack.push(image);

    if (
        undoStack.length >
        MAX_HISTORY
    ) {

        undoStack.shift();

    }

    redoStack.length = 0;

    updateUndoRedo();

}


function restoreImage(imageData) {

    rawCtx.putImageData(
        imageData,
        0,
        0
    );

    applyFilters();

    invalidateAudio();

}


function undo() {

    if (
        undoStack.length === 0
    ) {
        return;
    }

    const current =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    redoStack.push(current);

    const previous =
        undoStack.pop();

    restoreImage(previous);

    updateUndoRedo();

    setStatus(
        "Annulation."
    );

}


function redo() {

    if (
        redoStack.length === 0
    ) {
        return;
    }

    const current =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    undoStack.push(current);

    const next =
        redoStack.pop();

    restoreImage(next);

    updateUndoRedo();

    setStatus(
        "Rétablissement."
    );

}


function updateUndoRedo() {

    document.getElementById(
        "btn-undo"
    ).disabled =
        undoStack.length === 0;

    document.getElementById(
        "btn-redo"
    ).disabled =
        redoStack.length === 0;

}


document.getElementById(
    "btn-undo"
).addEventListener(
    "click",
    undo
);


document.getElementById(
    "btn-redo"
).addEventListener(
    "click",
    redo
);


/*
 * IMPORTANT :
 * Le bouton Effacer appelle directement
 * eraseDrawing().
 */

document.getElementById(
    "btn-clear"
).addEventListener(
    "click",
    eraseDrawing
);


/* =========================================================
   IMPORT IMAGE
========================================================= */

const fileInput =
    document.getElementById(
        "file-input"
    );


document.getElementById(
    "btn-browse"
).addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) return;

        saveHistory();

        const reader =
            new FileReader();

        reader.onload =
            e => {

                const img =
                    new Image();

                img.onload =
                    () => {

                        rawCtx.fillStyle =
                            "#ffffff";

                        rawCtx.fillRect(
                            0,
                            0,
                            rawCanvas.width,
                            rawCanvas.height
                        );

                        const scale =
                            Math.min(
                                rawCanvas.width /
                                img.width,

                                rawCanvas.height /
                                img.height
                            );

                        const width =
                            img.width * scale;

                        const height =
                            img.height * scale;

                        const x =
                            (
                                rawCanvas.width -
                                width
                            ) / 2;

                        const y =
                            (
                                rawCanvas.height -
                                height
                            ) / 2;

                        rawCtx.drawImage(
                            img,
                            x,
                            y,
                            width,
                            height
                        );

                        applyFilters();

                        invalidateAudio();

                        setStatus(
                            "Image importée."
                        );

                    };

                img.src =
                    e.target.result;

            };

        reader.readAsDataURL(
            file
        );

        fileInput.value = "";

    }
);


/* =========================================================
   FILTRES
========================================================= */

function applyFilters() {

    const contrast =
        parseFloat(
            document.getElementById(
                "contrast"
            ).value
        );

    const brightness =
        parseFloat(
            document.getElementById(
                "brightness"
            ).value
        );

    const invert =
        document.getElementById(
            "invert-bw"
        ).checked;

    const image =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    const data =
        image.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let gray =
            0.2126 * data[i] +
            0.7152 * data[i + 1] +
            0.0722 * data[i + 2];

        gray =
            (
                (gray - 128) *
                contrast +
                128
            ) * brightness;

        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );

        if (invert) {
            gray = 255 - gray;
        }

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }

    pCtx.putImageData(
        image,
        0,
        0
    );

    invalidateAudio();

}

/* =========================================================
   ANALYSE DU DESSIN
========================================================= */

function analyseColumns(
    numberOfColumns = 800
) {

    const image =
        pCtx.getImageData(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        );

    const data =
        image.data;

    const w =
        paintCanvas.width;

    const h =
        paintCanvas.height;

    const columns =
        new Array(
            numberOfColumns
        );


    for (
        let cx = 0;
        cx < numberOfColumns;
        cx++
    ) {

        const x =
            Math.floor(
                cx *
                (w - 1) /
                (numberOfColumns - 1)
            );

        let density = 0;
        let weightedY = 0;

        for (
            let y = 0;
            y < h;
            y++
        ) {

            const index =
                (y * w + x) * 4;

            const ink =
                1 -
                data[index] / 255;

            if (
                ink > 0.03
            ) {

                density += ink;

                weightedY +=
                    y * ink;

            }

        }

        if (
            density > 0
        ) {

            columns[cx] = {

                density:
                    Math.min(
                        1,
                        density / h
                    ),

                centroid:
                    weightedY /
                    density /
                    h

            };

        } else {

            columns[cx] = {

                density: 0,
                centroid: 0.5

            };

        }

    }


    /*
     * Lissage léger.
     */

    const smooth = [];

    for (
        let x = 0;
        x < numberOfColumns;
        x++
    ) {

        let d = 0;
        let y = 0;
        let count = 0;

        for (
            let k = -1;
            k <= 1;
            k++
        ) {

            const index =
                x + k;

            if (
                index >= 0 &&
                index < numberOfColumns
            ) {

                d +=
                    columns[index]
                        .density;

                y +=
                    columns[index]
                        .centroid;

                count++;

            }

        }

        smooth[x] = {

            density:
                d / count,

            centroid:
                y / count

        };

    }

    return smooth;

}


/* =========================================================
   GENERATION AUDIO
========================================================= */

async function generateAudio() {

    await initAudio();

    const signature =
        getSettingsSignature();

    if (
        lastAudioBuffer &&
        lastSettingsSignature ===
        signature
    ) {

        return lastAudioBuffer;

    }

    setProgress(5);

    const duration =
        parseFloat(
            document.getElementById(
                "duration"
            ).value
        );

    const sampleRate =
        audioCtx.sampleRate;

    const totalSamples =
        Math.floor(
            sampleRate *
            duration
        );

    const columns =
        analyseColumns(800);

    setProgress(15);

    const buffer =
        audioCtx.createBuffer(
            1,
            totalSamples,
            sampleRate
        );

    const channel =
        buffer.getChannelData(0);

    const engine =
        engineSelect.value;

    const invertFreq =
        document.getElementById(
            "invert-freq"
        ).checked;


    /* =====================================================
       SPECTRAL
    ====================================================== */

    if (
        engine === "spectral"
    ) {

        let fmin =
            parseFloat(
                document.getElementById(
                    "fmin"
                ).value
            ) || 80;

        let fmax =
            parseFloat(
                document.getElementById(
                    "fmax"
                ).value
            ) || 4000;

        let nBins =
            parseInt(
                document.getElementById(
                    "nbins"
                ).value
            ) || 40;

        fmin =
            Math.max(
                20,
                fmin
            );

        fmax =
            Math.max(
                fmin + 1,
                fmax
            );

        nBins =
            Math.max(
                2,
                nBins
            );


        for (
            let b = 0;
            b < nBins;
            b++
        ) {

            const normalized =
                b /
                (nBins - 1);

            const frequencyIndex =
                invertFreq
                    ? 1 - normalized
                    : normalized;

            const y =
                frequencyIndex;

            const frequency =
                fmin *
                Math.pow(
                    fmax / fmin,
                    frequencyIndex
                );

            let phase = 0;

            const phaseIncrement =
                2 *
                Math.PI *
                frequency /
                sampleRate;


            for (
                let i = 0;
                i < totalSamples;
                i++
            ) {

                const position =
                    i /
                    (totalSamples - 1);

                const columnIndex =
                    Math.min(
                        columns.length - 1,
                        Math.floor(
                            position *
                            (
                                columns.length - 1
                            )
                        )
                    );

                const column =
                    columns[columnIndex];

                /*
                 * La position verticale du bin
                 * influence directement la présence
                 * de cette composante.
                 */

                const verticalPosition =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            y
                        )
                    );

                /*
                 * Le point du dessin situé à cette
                 * hauteur est estimé à partir du
                 * profil local.
                 *
                 * La densité sert de matière sonore.
                 */

                let amp =
                    column.density;

                /*
                 * Une légère pondération selon la
                 * position verticale évite que toutes
                 * les bandes soient strictement identiques.
                 */

                amp *=
                    0.35 +
                    0.65 *
                    (
                        1 -
                        Math.abs(
                            column.centroid -
                            verticalPosition
                        )
                    );

                channel[i] +=
                    Math.sin(phase) *
                    amp /
                    Math.sqrt(nBins);

                phase +=
                    phaseIncrement;

            }

            setProgress(
                15 +
                65 *
                (
                    (b + 1) /
                    nBins
                )
            );

        }

    }


    /* =====================================================
       MCLAREN
    ====================================================== */

    else if (
        engine === "mclaren"
    ) {

        const baseFreq =
            Math.max(
                20,
                parseFloat(
                    document.getElementById(
                        "mclaren-freq"
                    ).value
                ) || 220
            );

        let phase = 0;

        for (
            let i = 0;
            i < totalSamples;
            i++
        ) {

            const position =
                i /
                (totalSamples - 1);

            const index =
                Math.min(
                    columns.length - 1,
                    Math.floor(
                        position *
                        (
                            columns.length - 1
                        )
                    )
                );

            const current =
                columns[index];

            let normalizedY =
                0.5 -
                current.centroid;

            if (invertFreq) {
                normalizedY =
                    -normalizedY;
            }

            const frequency =
                baseFreq *
                Math.pow(
                    2,
                    normalizedY * 2
                );

            phase +=
                2 *
                Math.PI *
                frequency /
                sampleRate;

            const amp =
                Math.min(
                    1,
                    current.density * 8
                );

            channel[i] =
                Math.sin(phase) *
                amp;

            if (
                i % 50000 === 0
            ) {

                setProgress(
                    15 +
                    65 *
                    (
                        i /
                        totalSamples
                    )
                );

            }

        }

    }


    /* =====================================================
       VARIABLE DENSITY
    ====================================================== */

    else {

        let seed =
            123456789;

        function random() {

            seed =
                (
                    1664525 *
                    seed +
                    1013904223
                ) >>> 0;

            return (
                seed /
                4294967296
            );

        }

        let noise = 0;

        for (
            let i = 0;
            i < totalSamples;
            i++
        ) {

            const position =
                i /
                (totalSamples - 1);

            const index =
                Math.min(
                    columns.length - 1,
                    Math.floor(
                        position *
                        (
                            columns.length - 1
                        )
                    )
                );

            const density =
                columns[index].density;

            noise =
                noise * 0.96 +
                random() * 0.04;

            channel[i] =
                (
                    noise * 2 - 1
                ) *
                Math.min(
                    1,
                    density * 10
                );

            if (
                i % 50000 === 0
            ) {

                setProgress(
                    15 +
                    65 *
                    (
                        i /
                        totalSamples
                    )
                );

            }

        }

    }


    /* =====================================================
       NORMALISATION
    ====================================================== */

    let maxAmp = 0;

    for (
        let i = 0;
        i < totalSamples;
        i++
    ) {

        maxAmp =
            Math.max(
                maxAmp,
                Math.abs(
                    channel[i]
                )
            );

    }


    if (
        maxAmp > 0
    ) {

        for (
            let i = 0;
            i < totalSamples;
            i++
        ) {

            channel[i] =
                channel[i] /
                maxAmp *
                0.82;

        }

    }


    /* =====================================================
       FADE
    ====================================================== */

    const fadeSamples =
        Math.min(
            Math.floor(
                sampleRate * 0.025
            ),
            Math.floor(
                totalSamples / 2
            )
        );


    for (
        let i = 0;
        i < fadeSamples;
        i++
    ) {

        const factor =
            i /
            fadeSamples;

        channel[i] *=
            factor;

        channel[
            totalSamples -
            1 -
            i
        ] *=
            factor;

    }


    lastAudioBuffer =
        buffer;

    lastSettingsSignature =
        signature;

    setProgress(100);

    return buffer;

}


/* =========================================================
   LECTURE
========================================================= */

async function playAudio() {

    await initAudio();

    stopPlayback(false);

    setStatus(
        "Calcul de l'audio…"
    );

    try {

        const buffer =
            await generateAudio();

        currentSource =
            audioCtx.createBufferSource();

        currentSource.buffer =
            buffer;


        const gain =
            audioCtx.createGain();

        gain.gain.value =
            0.85;


        const compressor =
            audioCtx
                .createDynamicsCompressor();

        compressor.threshold.value =
            -12;

        compressor.knee.value =
            18;

        compressor.ratio.value =
            3;

        compressor.attack.value =
            0.003;

        compressor.release.value =
            0.2;


        currentSource.connect(
            gain
        );

        gain.connect(
            compressor
        );

        compressor.connect(
            audioCtx.destination
        );


        playbackStartTime =
            audioCtx.currentTime;

        playbackDuration =
            buffer.duration;


        currentSource.onended =
            () => {

                currentSource =
                    null;

                setAudioState(
                    "ready"
                );

                setStatus(
                    "Lecture terminée."
                );

                stopScan();

            };


        currentSource.start();

        setAudioState(
            "playing"
        );

        setStatus(
            "Lecture en cours…"
        );

        animateScan();

    } catch (error) {

        console.error(error);

        setStatus(
            "Impossible de générer le son."
        );

    }

}


function stopPlayback(
    updateStatus = true
) {

    if (currentSource) {

        try {

            currentSource.onended =
                null;

            currentSource.stop();

        } catch (e) {}

        currentSource =
            null;

    }

    stopScan();

    setAudioState(
        "ready"
    );

    if (updateStatus) {

        setStatus(
            "Arrêté."
        );

    }

}


document.getElementById(
    "btn-play"
).addEventListener(
    "click",
    playAudio
);


document.getElementById(
    "btn-stop"
).addEventListener(
    "click",
    () => stopPlayback(true)
);


/* =========================================================
   BALAYAGE
========================================================= */

function animateScan() {

    if (!currentSource) {
        return;
    }

    const elapsed =
        audioCtx.currentTime -
        playbackStartTime;

    const progress =
        Math.min(
            1,
            elapsed /
            playbackDuration
        );

    const line =
        document.getElementById(
            "scan-line"
        );

    line.style.display =
        "block";

    line.style.left =
        (
            progress *
            100
        ) + "%";


    if (
        progress < 1
    ) {

        animationFrame =
            requestAnimationFrame(
                animateScan
            );

    } else {

        stopScan();

    }

}


function stopScan() {

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }

    document.getElementById(
        "scan-line"
    ).style.display =
        "none";

}

function showSpectrogram(
    buffer
) {

    const modal =
        document.getElementById(
            "modal-spectro"
        );

    modal.classList.add(
        "visible"
    );

    const canvas =
        document.getElementById(
            "spectroCanvas"
        );

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio ||
        1;

    canvas.width =
        Math.floor(
            rect.width * dpr
        );

    canvas.height =
        Math.floor(
            rect.height * dpr
        );

    const ctx =
        canvas.getContext("2d");

    ctx.scale(
        dpr,
        dpr
    );

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.fillStyle =
        "#050505";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     * Visualisation fréquentielle.
     */

    const data =
        buffer.getChannelData(0);

    const fftSize =
        1024;

    const columns =
        Math.floor(width);

    const bins =
        Math.floor(
            fftSize / 2
        );


    /*
     * Pour rester raisonnable sur téléphone,
     * on utilise un sous-échantillonnage.
     */

    for (
        let x = 0;
        x < columns;
        x++
    ) {

        const center =
            Math.floor(
                x *
                (
                    data.length -
                    fftSize
                ) /
                Math.max(
                    1,
                    columns - 1
                )
            );


        for (
            let b = 0;
            b < bins;
            b++
        ) {

            let real = 0;
            let imag = 0;

            const frequency =
                b / fftSize;


            for (
                let n = 0;
                n < fftSize;
                n += 8
            ) {

                const sample =
                    data[
                        center + n
                    ] || 0;

                const angle =
                    2 *
                    Math.PI *
                    frequency *
                    n;

                real +=
                    sample *
                    Math.cos(angle);

                imag -=
                    sample *
                    Math.sin(angle);

            }


            const magnitude =
                Math.sqrt(
                    real * real +
                    imag * imag
                ) / 128;


            if (
                magnitude > 0.015
            ) {

                const intensity =
                    Math.min(
                        1,
                        magnitude * 5
                    );

                const r =
                    Math.floor(
                        35 +
                        90 *
                        intensity
                    );

                const g =
                    Math.floor(
                        55 +
                        130 *
                        intensity
                    );

                const bcol =
                    Math.floor(
                        70 +
                        160 *
                        intensity
                    );

                ctx.fillStyle =
                    `rgb(${r},${g},${bcol})`;

                ctx.fillRect(
                    x,
                    height -
                    (
                        b /
                        bins
                    ) *
                    height,
                    1,
                    Math.max(
                        1,
                        height /
                        bins
                    )
                );

            }

        }

    }

}

    "click",
    async () => {

        );

        try {

            const buffer =
                lastAudioBuffer ||
                await generateAudio();

            const wav =
                audioBufferToWav(
                    buffer
                );

            const blob =
                new Blob(
                    [wav],
                    {
                        type:
                            "audio/wav"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                url;

            link.download =
                "dessin-sonore.wav";

            link.click();

            setTimeout(
                () => {
                    URL.revokeObjectURL(
                        url
                    );
                },
                1000
            );

            setStatus(
                "Son exporté en WAV."
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "Impossible d'exporter le WAV."
            );

        }

    }
);


/* =========================================================
   ENCODAGE WAV
========================================================= */

function audioBufferToWav(
    buffer
) {

    const channels =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const length =
        buffer.length *
        channels *
        2;

    const arrayBuffer =
        new ArrayBuffer(
            44 + length
        );

    const view =
        new DataView(
            arrayBuffer
        );


    function writeString(
        offset,
        string
    ) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );

        }

    }


    writeString(
        0,
        "RIFF"
    );

    view.setUint32(
        4,
        36 + length,
        true
    );

    writeString(
        8,
        "WAVE"
    );

    writeString(
        12,
        "fmt "
    );

    view.setUint32(
        16,
        16,
        true
    );

    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        channels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        sampleRate *
        channels *
        2,
        true
    );

    view.setUint16(
        32,
        channels * 2,
        true
    );

    view.setUint16(
        34,
        16,
        true
    );

    writeString(
        36,
        "data"
    );

    view.setUint32(
        40,
        length,
        true
    );


    const channelData = [];

    for (
        let c = 0;
        c < channels;
        c++
    ) {

        channelData.push(
            buffer.getChannelData(c)
        );

    }


    let offset = 44;


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        for (
            let c = 0;
            c < channels;
            c++
        ) {

            let sample =
                channelData[c][i];

            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );

            sample =
                sample < 0
                    ? sample * 0x8000
                    : sample * 0x7fff;

            view.setInt16(
                offset,
                sample,
                true
            );

            offset += 2;

        }

    }

    return arrayBuffer;

}


/* =========================================================
   RACCOURCIS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "z"
        ) {

            event.preventDefault();

            if (event.shiftKey) {
                redo();
            } else {
                undo();
            }

        }


        if (
            event.code === "Space" &&
            event.target.tagName !==
            "INPUT" &&
            event.target.tagName !==
            "SELECT"
        ) {

            event.preventDefault();

            if (currentSource) {

                stopPlayback(true);

            } else {

                playAudio();

            }

        }


        if (
            event.key === "Escape"
        ) {

            document.getElementById(
                "modal-spectro"
            ).classList.remove(
                "visible"
            );

        }

    }
);


/* =========================================================
   ETAT INITIAL
========================================================= */

updateUndoRedo();
setAudioState("ready");
setProgress(0);

</script>
