<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dessin Sonore V3.1</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #eee;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    height: 58px;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #181818;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
}

.audio-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #aaa;
}

.audio-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #555;
}

.audio-dot.active {
    background: #5fd18b;
    box-shadow: 0 0 8px rgba(95,209,139,.8);
}

/* =========================================================
   LAYOUT
   ========================================================= */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
}

.workspace {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
}

.sidebar {
    width: 330px;
    flex: 0 0 330px;
    overflow-y: auto;
    padding: 14px;
    background: #181818;
    border-left: 1px solid #333;
}

/* =========================================================
   CANVAS
   ========================================================= */

.canvas-card {
    flex: 1;
    min-height: 0;
    background: #202020;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.canvas-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
}

canvas#paintCanvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
    cursor: crosshair;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 2px 0;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.toolbar label {
    font-size: 11px;
    color: #aaa;
}

input[type="range"] {
    accent-color: #ddd;
}

.toolbar input[type="range"] {
    width: 110px;
}

button {
    border: 1px solid #444;
    background: #292929;
    color: #eee;
    border-radius: 5px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 12px;
}

button:hover {
    background: #353535;
}

button:active {
    transform: translateY(1px);
}

button.primary {
    background: #eee;
    color: #111;
    border-color: #eee;
}

button.primary:hover {
    background: #fff;
}

button.danger {
    border-color: #754444;
}

/* =========================================================
   PLAYBACK
   ========================================================= */

.play-strip {
    height: 36px;
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.play-strip input[type="range"] {
    flex: 1;
}

.time-value {
    width: 52px;
    text-align: right;
    color: #aaa;
    font-size: 11px;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.section {
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid #303030;
}

.section:last-child {
    border-bottom: none;
}

.section-title {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.mode-tabs {
    display: flex;
    gap: 5px;
}

.mode-tab {
    flex: 1;
    padding: 7px;
    text-align: center;
    border: 1px solid #3d3d3d;
    background: #222;
    color: #aaa;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
}

.mode-tab.active {
    color: #111;
    background: #eee;
    border-color: #eee;
}

.control {
    margin-bottom: 12px;
}

.control:last-child {
    margin-bottom: 0;
}

.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.control-row label {
    font-size: 12px;
    color: #ccc;
}

.control-value {
    color: #888;
    font-size: 11px;
    min-width: 45px;
    text-align: right;
}

.control input[type="range"] {
    width: 100%;
}

select {
    width: 100%;
    padding: 7px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 5px;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #ccc;
    margin-bottom: 9px;
}

.checkbox-row input {
    accent-color: #eee;
}

/* =========================================================
   ACTIONS
   ========================================================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.actions button:last-child {
    grid-column: 1 / -1;
}

/* =========================================================
   MODAL SPECTROGRAMME
   ========================================================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal.visible {
    display: flex;
}

.modal-content {
    width: min(1000px, 96vw);
    height: min(700px, 90vh);
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.modal-header h2 {
    margin: 0;
    font-size: 15px;
    font-weight: normal;
}

#spectrogramCanvas {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #000;
}

/* =========================================================
   STATUS
   ========================================================= */

.status {
    position: fixed;
    left: 14px;
    bottom: 10px;
    padding: 5px 9px;
    background: rgba(20,20,20,.85);
    border: 1px solid #333;
    border-radius: 4px;
    color: #999;
    font-size: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    z-index: 50;
}

.status.visible {
    opacity: 1;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 850px) {
    html, body { overflow: auto; }
    .main { flex-direction: column; overflow: visible; }
    .workspace { height: 65vh; min-height: 420px; }
    .sidebar { width: 100%; flex: none; border-left: none; border-top: 1px solid #333; }
    .canvas-card { min-height: 290px; }
}
</style>
</head>

<body>

<header>
    <h1>DESSIN SONORE V3.1</h1>
    <div class="audio-status">
        <span class="audio-dot" id="audio-dot"></span>
        <span id="audio-status-text">Audio arrêté</span>
    </div>
</header>

<div class="main">
    <section class="workspace">
        <div class="canvas-card">
            <div class="canvas-wrapper">
                <canvas id="paintCanvas" width="800" height="600"></canvas>
            </div>
            <div class="toolbar">
                <div class="toolbar-group">
                    <label for="brush-size">Épaisseur</label>
                    <input id="brush-size" type="range" min="1" max="60" value="5">
                    <span id="brush-size-value">5</span>
                </div>
                <button id="btn-browse">Importer</button>
                <input type="file" id="file-input" accept="image/*" hidden>
                <button id="btn-clear" class="danger">Effacer</button>
                <button id="btn-reset">Réinitialiser</button>
            </div>
        </div>

        <div class="play-strip">
            <button id="btn-play" class="primary">▶ Lire</button>
            <button id="btn-stop">■</button>
            <input id="play-position" type="range" min="0" max="1000" value="0">
            <div class="time-value" id="time-val">0:00</div>
        </div>
    </section>

    <aside class="sidebar">
        <div class="section">
            <div class="section-title">Mode</div>
            <div class="mode-tabs">
                <div class="mode-tab active" data-mode="draw">Dessin</div>
                <div class="mode-tab" data-mode="analyse">Analyse</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Image</div>
            <div class="control">
                <div class="control-row">
                    <label for="contrast">Contraste</label>
                    <span class="control-value" id="contrast-value">100</span>
                </div>
                <input id="contrast" type="range" min="0" max="200" value="100">
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="brightness">Luminosité</label>
                    <span class="control-value" id="brightness-value">0</span>
                </div>
                <input id="brightness" type="range" min="-100" max="100" value="0">
            </div>
            <label class="checkbox-row">
                <input id="invert" type="checkbox"> Inverser noir / blanc
            </label>
            <label class="checkbox-row">
                <input id="invert-frequency" type="checkbox"> Inverser les fréquences
            </label>
        </div>

        <div class="section">
            <div class="section-title">Interprétation</div>
            <div class="control">
                <label for="interpretation">Lecture du dessin</label>
                <select id="interpretation">
                    <option value="spectral">Pixels — spectral</option>
                    <option value="contours">Contours — spectral</option>
                    <option value="mclaren">McLaren — trajectoire</option>
                    <option value="density">Masse — densité</option>
                </select>
            </div>
            <div class="control">
                <label for="scale">Échelle</label>
                <select id="scale">
                    <option value="free">Libre</option>
                    <option value="chromatic">Chromatique</option>
                    <option value="major">Majeure</option>
                    <option value="minor">Mineure</option>
                    <option value="pentatonic">Pentatonique</option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Son</div>
            <div class="control">
                <div class="control-row">
                    <label for="duration">Durée</label>
                    <span class="control-value" id="duration-value">10 s</span>
                </div>
                <input id="duration" type="range" min="1" max="30" step="1" value="10">
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="volume">Volume</label>
                    <span class="control-value" id="volume-value">70 %</span>
                </div>
                <input id="volume" type="range" min="0" max="100" value="70">
            </div>
            <div class="control">
                <label for="waveform">Forme d'onde</label>
                <select id="waveform">
                    <option value="sine">Sinusoïde</option>
                    <option value="triangle">Triangle</option>
                    <option value="sawtooth">Dent de scie</option>
                    <option value="square">Carré</option>
                    <option value="noise">Bruit</option>
                </select>
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="attack">Attaque</label>
                    <span class="control-value" id="attack-value">0.02 s</span>
                </div>
                <input id="attack" type="range" min="0" max="1" step="0.01" value="0.02">
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="release">Relâchement</label>
                    <span class="control-value" id="release-value">0.5 s</span>
                </div>
                <input id="release" type="range" min="0.05" max="3" step="0.05" value="0.5">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Avancé</div>
            <div class="control">
                <div class="control-row">
                    <label for="fmin">Fréquence min.</label>
                    <span class="control-value" id="fmin-value">80 Hz</span>
                </div>
                <input id="fmin" type="range" min="20" max="1000" step="1" value="80">
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="fmax">Fréquence max.</label>
                    <span class="control-value" id="fmax-value">4000 Hz</span>
                </div>
                <input id="fmax" type="range" min="500" max="12000" step="10" value="4000">
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="bins">Résolution</label>
                    <span class="control-value" id="bins-value">32</span>
                </div>
                <input id="bins" type="range" min="4" max="128" step="1" value="32">
            </div>
            <div class="control">
                <div class="control-row">
                    <label for="mclaren-frequency">McLaren</label>
                    <span class="control-value" id="mclaren-frequency-value">440 Hz</span>
                </div>
                <input id="mclaren-frequency" type="range" min="50" max="1000" step="1" value="440">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Actions</div>
            <div class="actions">
                <button id="btn-play-side" class="primary">▶ Lire</button>
                <button id="btn-stop-side">■ Stop</button>
                <button id="btn-spectrogram">Spectrogramme</button>
            </div>
        </div>
    </aside>
</div>

<div class="modal" id="spectrogram-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Spectrogramme</h2>
            <button id="btn-close-spectrogram">Fermer</button>
        </div>
        <canvas id="spectrogramCanvas"></canvas>
    </div>
</div>

<div class="status" id="status"></div>

<script>
const canvas = document.getElementById("paintCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

const rawCanvas = document.createElement("canvas");
rawCanvas.width = canvas.width;
rawCanvas.height = canvas.height;
const rawCtx = rawCanvas.getContext("2d", { willReadFrequently: true });

let isDrawing = false;
let activePointerId = null;
let currentMode = "draw";

let audioCtx = null;
let currentSource = null;
let lastAudioBuffer = null;

let animationFrame = null;
let playbackStartTime = 0;
let playbackDuration = 0;

function initCanvases() {
    rawCtx.fillStyle = "#ffffff";
    rawCtx.fillRect(0, 0, rawCanvas.width, rawCanvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}
initCanvases();

function showStatus(message, duration = 1500) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.classList.add("visible");
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => {
        status.classList.remove("visible");
    }, duration);
}

function setAudioStatus(active) {
    const dot = document.getElementById("audio-dot");
    const text = document.getElementById("audio-status-text");
    if (active) {
        dot.classList.add("active");
        text.textContent = "Audio en cours";
    } else {
        dot.classList.remove("active");
        text.textContent = "Audio arrêté";
    }
}

function formatTime(seconds) {
    if (!isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ":" + String(secs).padStart(2, "0");
}

function getPointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
    };
}

function startDraw(event) {
    if (currentMode !== "draw") return;
    event.preventDefault();

    if (currentSource) stopAudio();

    isDrawing = true;
    activePointerId = event.pointerId;

    try { canvas.setPointerCapture(event.pointerId); } catch (e) {}

    const pos = getPointerPosition(event);
    const size = Number(document.getElementById("brush-size").value);

    rawCtx.fillStyle = "#000000";
    rawCtx.beginPath();
    rawCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
    rawCtx.fill();

    draw.lastX = pos.x;
    draw.lastY = pos.y;

    applyFilters();
    lastAudioBuffer = null;
}

function draw(event) {
    if (!isDrawing || currentMode !== "draw") return;
    if (activePointerId !== null && event.pointerId !== activePointerId) return;

    event.preventDefault();
    const pos = getPointerPosition(event);
    const size = Number(document.getElementById("brush-size").value);

    rawCtx.lineCap = "round";
    rawCtx.lineJoin = "round";
    rawCtx.strokeStyle = "#000000";
    rawCtx.lineWidth = size;

    if (typeof draw.lastX === "number" && typeof draw.lastY === "number") {
        rawCtx.beginPath();
        rawCtx.moveTo(draw.lastX, draw.lastY);
        rawCtx.lineTo(pos.x, pos.y);
        rawCtx.stroke();
    } else {
        rawCtx.beginPath();
        rawCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
        rawCtx.fillStyle = "#000000";
        rawCtx.fill();
    }

    draw.lastX = pos.x;
    draw.lastY = pos.y;

    applyFilters();
    lastAudioBuffer = null;
}

function stopDraw(event) {
    if (!isDrawing) return;
    if (event && activePointerId !== null && event.pointerId !== activePointerId) return;

    isDrawing = false;
    draw.lastX = null;
    draw.lastY = null;

    try {
        if (activePointerId !== null && canvas.hasPointerCapture(activePointerId)) {
            canvas.releasePointerCapture(activePointerId);
        }
    } catch (e) {}

    activePointerId = null;
    applyFilters();
    lastAudioBuffer = null;
}

canvas.addEventListener("pointerdown", startDraw);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDraw);
canvas.addEventListener("pointercancel", stopDraw);
canvas.addEventListener("contextmenu", event => event.preventDefault());

function clearCanvas() {
    stopAudio();
    initCanvases();
    lastAudioBuffer = null;
    document.getElementById("play-position").value = 0;
    document.getElementById("time-val").textContent = "0:00";
    showStatus("Dessin effacé");
}

document.getElementById("btn-clear").addEventListener("click", clearCanvas);

function resetImage() {
    stopAudio();
    document.getElementById("contrast").value = 100;
    document.getElementById("brightness").value = 0;
    document.getElementById("invert").checked = false;
    document.getElementById("invert-frequency").checked = false;
    document.getElementById("interpretation").value = "
