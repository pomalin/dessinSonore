<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dessin Sonore V3.1</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #eee;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
   ========================================================= */

header {
    height: 58px;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #181818;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
}

.audio-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #aaa;
}

.audio-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #555;
}

.audio-dot.active {
    background: #5fd18b;
    box-shadow: 0 0 8px rgba(95,209,139,.8);
}

/* =========================================================
   LAYOUT
   ========================================================= */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
}

.workspace {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
}

.sidebar {
    width: 330px;
    flex: 0 0 330px;
    overflow-y: auto;
    padding: 14px;
    background: #181818;
    border-left: 1px solid #333;
}

/* =========================================================
   CANVAS
   ========================================================= */

.canvas-card {
    flex: 1;
    min-height: 0;
    background: #202020;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.canvas-wrapper {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
}

canvas#paintCanvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #fff;
    cursor: crosshair;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 2px 0;
}

.toolbar-group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.toolbar label {
    font-size: 11px;
    color: #aaa;
}

input[type="range"] {
    accent-color: #ddd;
}

.toolbar input[type="range"] {
    width: 110px;
}

button {
    border: 1px solid #444;
    background: #292929;
    color: #eee;
    border-radius: 5px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 12px;
}

button:hover {
    background: #353535;
}

button:active {
    transform: translateY(1px);
}

button.primary {
    background: #eee;
    color: #111;
    border-color: #eee;
}

button.primary:hover {
    background: #fff;
}

button.danger {
    border-color: #754444;
}

/* =========================================================
   PLAYBACK
   ========================================================= */

.play-strip {
    height: 36px;
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.play-strip input[type="range"] {
    flex: 1;
}

.time-value {
    width: 52px;
    text-align: right;
    color: #aaa;
    font-size: 11px;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.section {
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid #303030;
}

.section:last-child {
    border-bottom: none;
}

.section-title {
    font-size: 11px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.mode-tabs {
    display: flex;
    gap: 5px;
}

.mode-tab {
    flex: 1;
    padding: 7px;
    text-align: center;
    border: 1px solid #3d3d3d;
    background: #222;
    color: #aaa;
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
}

.mode-tab.active {
    color: #111;
    background: #eee;
    border-color: #eee;
}

.control {
    margin-bottom: 12px;
}

.control:last-child {
    margin-bottom: 0;
}

.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.control-row label {
    font-size: 12px;
    color: #ccc;
}

.control-value {
    color: #888;
    font-size: 11px;
    min-width: 45px;
    text-align: right;
}

.control input[type="range"] {
    width: 100%;
}

select {
    width: 100%;
    padding: 7px;
    background: #222;
    color: #eee;
    border: 1px solid #444;
    border-radius: 5px;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #ccc;
    margin-bottom: 9px;
}

.checkbox-row input {
    accent-color: #eee;
}

/* =========================================================
   ACTIONS
   ========================================================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.actions button:last-child {
    grid-column: 1 / -1;
}

/* =========================================================
   MODAL SPECTROGRAMME
   ========================================================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal.visible {
    display: flex;
}

.modal-content {
    width: min(1000px, 96vw);
    height: min(700px, 90vh);
    background: #191919;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.modal-header h2 {
    margin: 0;
    font-size: 15px;
    font-weight: normal;
}

#spectrogramCanvas {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #000;
}

/* =========================================================
   STATUS
   ========================================================= */

.status {
    position: fixed;
    left: 14px;
    bottom: 10px;
    padding: 5px 9px;
    background: rgba(20,20,20,.85);
    border: 1px solid #333;
    border-radius: 4px;
    color: #999;
    font-size: 10px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s;
    z-index: 50;
}

.status.visible {
    opacity: 1;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 850px) {
    html, body { overflow: auto; }
    .main { flex-direction: column; overflow: visible; }
    .workspace { height: 65vh; min-height: 420px; }
    .sidebar { width: 100%; flex: none; border-left: none; border-top: 1px solid #333; }
    .canvas-card { min-height: 290px; }
}
</style>
</head>

}
initCanvases();

function showStatus(message, duration = 1500) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.classList.add("visible");
    clearTimeout(showStatus.timer);
    showStatus.timer = setTimeout(() => {
        status.classList.remove("visible");
    }, duration);
}

function setAudioStatus(active) {
    const dot = document.getElementById("audio-dot");
    const text = document.getElementById("audio-status-text");
    if (active) {
        dot.classList.add("active");
        text.textContent = "Audio en cours";
    } else {
        dot.classList.remove("active");
        text.textContent = "Audio arrêté";
    }
}

function formatTime(seconds) {
    if (!isFinite(seconds)) return "0:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ":" + String(secs).padStart(2, "0");
}

function getPointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
    };
}

function startDraw(event) {

    event.preventDefault();

    const pos = getPointerPosition(event);

    rawCtx.fillStyle = "#000000";
    rawCtx.beginPath();
    rawCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
    rawCtx.fill();

    lastAudioBuffer = null;
}

function draw(event) {
    if (!isDrawing || currentMode !== "draw") return;
    if (activePointerId !== null && event.pointerId !== activePointerId) return;

    event.preventDefault();
    const pos = getPointerPosition(event);
    const size = Number(document.getElementById("brush-size").value);

    rawCtx.lineCap = "round";
    rawCtx.lineJoin = "round";
    rawCtx.strokeStyle = "#000000";
    rawCtx.lineWidth = size;

    if (typeof draw.lastX === "number" && typeof draw.lastY === "number") {
        rawCtx.beginPath();
        rawCtx.moveTo(draw.lastX, draw.lastY);
        rawCtx.lineTo(pos.x, pos.y);
        rawCtx.stroke();
    } else {
        rawCtx.beginPath();
        rawCtx.arc(pos.x, pos.y, size / 2, 0, Math.PI * 2);
        rawCtx.fillStyle = "#000000";
        rawCtx.fill();
    }

    draw.lastX = pos.x;
    draw.lastY = pos.y;

    applyFilters();
    lastAudioBuffer = null;
}

function stopDraw(event) {
    if (!isDrawing) return;
    if (event && activePointerId !== null && event.pointerId !== activePointerId) return;

    isDrawing = false;
    draw.lastX = null;
    draw.lastY = null;

    try {
        if (activePointerId !== null && canvas.hasPointerCapture(activePointerId)) {
            canvas.releasePointerCapture(activePointerId);
        }
    } catch (e) {}

    activePointerId = null;
    applyFilters();
    lastAudioBuffer = null;
}

canvas.addEventListener("pointerdown", startDraw);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDraw);
canvas.addEventListener("pointercancel", stopDraw);
canvas.addEventListener("contextmenu", event => event.preventDefault());

    showStatus("Dessin effacé");
}

<script>
"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const paintCanvas =
    document.getElementById("paintCanvas");

const pCtx =
    paintCanvas.getContext(
        "2d",
        { willReadFrequently: true }
    );

const rawCanvas =
    document.createElement("canvas");

rawCanvas.width =
    paintCanvas.width;

rawCanvas.height =
    paintCanvas.height;

const rawCtx =
    rawCanvas.getContext(
        "2d",
        { willReadFrequently: true }
    );


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let currentSource = null;
let lastAudioBuffer = null;
let lastSettingsSignature = null;

let playbackStartTime = 0;
let playbackDuration = 0;
let animationFrame = null;


async function initAudio() {

    if (!audioCtx) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        audioCtx =
            new AudioContext();

    }

    if (
        audioCtx.state === "suspended"
    ) {

        await audioCtx.resume();

    }

}


/* =========================================================
   ETAT AUDIO
========================================================= */

function setAudioState(state) {

    const dot =
        document.getElementById(
            "audio-dot"
        );

    const indicator =
        document.getElementById(
            "audio-indicator"
        );

    dot.className =
        "audio-dot " +
        (
            state === "playing"
                ? "playing"
                : "ready"
        );

    indicator.textContent =
        state === "playing"
            ? "AUDIO : LECTURE"
            : "AUDIO : PRÊT";

}


/* =========================================================
   UTILITAIRES
========================================================= */

function setStatus(text) {

    document.getElementById(
        "status-bar"
    ).textContent = text;

}


function setProgress(value) {

    document.getElementById(
        "progress"
    ).style.width =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        ) + "%";

}


function invalidateAudio() {

    lastAudioBuffer = null;
    lastSettingsSignature = null;

}


/* =========================================================
   EFFACEMENT
========================================================= */

/*
 * Fonction d'effacement centrale.
 *
 * Elle ne dépend d'aucun filtre, d'aucun moteur
 * et d'aucun état précédent.
 *
 * Les deux canvases sont explicitement remis
 * en blanc.
 */

function eraseDrawing() {

    stopPlayback(false);

    pCtx.clearRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );

    rawCtx.clearRect(
        0,
        0,
        rawCanvas.width,
        rawCanvas.height
    );

    pCtx.fillStyle = "#ffffff";

    pCtx.fillRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );

    rawCtx.fillStyle = "#ffffff";

    rawCtx.fillRect(
        0,
        0,
        rawCanvas.width,
        rawCanvas.height
    );

    invalidateAudio();

    undoStack.length = 0;
    redoStack.length = 0;

    updateUndoRedo();

    setProgress(0);

    setStatus(
        "Dessin effacé."
    );

}


/* =========================================================
   INITIALISATION CANVAS
========================================================= */

eraseDrawing();


/* =========================================================
   DESSIN
========================================================= */

let isDrawing = false;
let lastX = 0;
let lastY = 0;
let historySavedForStroke = false;

const brushSlider =
    document.getElementById(
        "brush-size"
    );


brushSlider.addEventListener(
    "input",
    () => {

        document.getElementById(
            "brush-val"
        ).textContent =
            brushSlider.value;

    }
);


function getPosition(event) {

    const rect =
        paintCanvas.getBoundingClientRect();

    return {

        x:
            (event.clientX - rect.left) *
            paintCanvas.width /
            rect.width,

        y:
            (event.clientY - rect.top) *
            paintCanvas.height /
            rect.height

    };

}


function startDrawing(event) {

    if (
        event.pointerType === "mouse" &&
        event.button !== 0
    ) {
        return;
    }

    if (!historySavedForStroke) {

        saveHistory();

        historySavedForStroke =
            true;

    }

    try {

        paintCanvas.setPointerCapture(
            event.pointerId
        );

    } catch (e) {}

    isDrawing = true;

    const p =
        getPosition(event);

    lastX = p.x;
    lastY = p.y;

    drawPoint(
        p.x,
        p.y
    );

}


function drawPoint(x, y) {

    const size =
        parseFloat(
            brushSlider.value
        );

    [pCtx, rawCtx].forEach(
        ctx => {

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                size / 2,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#000000";

            ctx.fill();

        }
    );

}


function draw(event) {

    if (!isDrawing) return;

    const p =
        getPosition(event);

    const size =
        parseFloat(
            brushSlider.value
        );

    [pCtx, rawCtx].forEach(
        ctx => {

            ctx.beginPath();

            ctx.moveTo(
                lastX,
                lastY
            );

            ctx.lineTo(
                p.x,
                p.y
            );

            ctx.strokeStyle =
                "#000000";

            ctx.lineWidth =
                size;

            ctx.lineCap =
                "round";

            ctx.lineJoin =
                "round";

            ctx.stroke();

        }
    );

    lastX = p.x;
    lastY = p.y;

}


function stopDrawing(event) {

    if (!isDrawing) return;

    isDrawing = false;

    try {

        paintCanvas.releasePointerCapture(
            event.pointerId
        );

    } catch (e) {}

    historySavedForStroke =
        false;

    applyFilters();

    invalidateAudio();

}


paintCanvas.addEventListener(
    "pointerdown",
    startDrawing
);

paintCanvas.addEventListener(
    "pointermove",
    draw
);

paintCanvas.addEventListener(
    "pointerup",
    stopDrawing
);

paintCanvas.addEventListener(
    "pointercancel",
    stopDrawing
);


/* =========================================================
   HISTORIQUE
========================================================= */

const undoStack = [];
const redoStack = [];

const MAX_HISTORY = 20;


function saveHistory() {

    const image =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    undoStack.push(image);

    if (
        undoStack.length >
        MAX_HISTORY
    ) {

        undoStack.shift();

    }

    redoStack.length = 0;

    updateUndoRedo();

}


function restoreImage(imageData) {

    rawCtx.putImageData(
        imageData,
        0,
        0
    );

    applyFilters();

    invalidateAudio();

}


function undo() {

    if (
        undoStack.length === 0
    ) {
        return;
    }

    const current =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    redoStack.push(current);

    const previous =
        undoStack.pop();

    restoreImage(previous);

    updateUndoRedo();

    setStatus(
        "Annulation."
    );

}


function redo() {

    if (
        redoStack.length === 0
    ) {
        return;
    }

    const current =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    undoStack.push(current);

    const next =
        redoStack.pop();

    restoreImage(next);

    updateUndoRedo();

    setStatus(
        "Rétablissement."
    );

}


function updateUndoRedo() {

    document.getElementById(
        "btn-undo"
    ).disabled =
        undoStack.length === 0;

    document.getElementById(
        "btn-redo"
    ).disabled =
        redoStack.length === 0;

}


document.getElementById(
    "btn-undo"
).addEventListener(
    "click",
    undo
);


document.getElementById(
    "btn-redo"
).addEventListener(
    "click",
    redo
);


/*
 * IMPORTANT :
 * Le bouton Effacer appelle directement
 * eraseDrawing().
 */

document.getElementById(
    "btn-clear"
).addEventListener(
    "click",
    eraseDrawing
);


/* =========================================================
   IMPORT IMAGE
========================================================= */

const fileInput =
    document.getElementById(
        "file-input"
    );


document.getElementById(
    "btn-browse"
).addEventListener(
    "click",
    () => fileInput.click()
);


fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file) return;

        saveHistory();

        const reader =
            new FileReader();

        reader.onload =
            e => {

                const img =
                    new Image();

                img.onload =
                    () => {

                        rawCtx.fillStyle =
                            "#ffffff";

                        rawCtx.fillRect(
                            0,
                            0,
                            rawCanvas.width,
                            rawCanvas.height
                        );

                        const scale =
                            Math.min(
                                rawCanvas.width /
                                img.width,

                                rawCanvas.height /
                                img.height
                            );

                        const width =
                            img.width * scale;

                        const height =
                            img.height * scale;

                        const x =
                            (
                                rawCanvas.width -
                                width
                            ) / 2;

                        const y =
                            (
                                rawCanvas.height -
                                height
                            ) / 2;

                        rawCtx.drawImage(
                            img,
                            x,
                            y,
                            width,
                            height
                        );

                        applyFilters();

                        invalidateAudio();

                        setStatus(
                            "Image importée."
                        );

                    };

                img.src =
                    e.target.result;

            };

        reader.readAsDataURL(
            file
        );

        fileInput.value = "";

    }
);


/* =========================================================
   FILTRES
========================================================= */

function applyFilters() {

    const contrast =
        parseFloat(
            document.getElementById(
                "contrast"
            ).value
        );

    const brightness =
        parseFloat(
            document.getElementById(
                "brightness"
            ).value
        );

    const invert =
        document.getElementById(
            "invert-bw"
        ).checked;

    const image =
        rawCtx.getImageData(
            0,
            0,
            rawCanvas.width,
            rawCanvas.height
        );

    const data =
        image.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let gray =
            0.2126 * data[i] +
            0.7152 * data[i + 1] +
            0.0722 * data[i + 2];

        gray =
            (
                (gray - 128) *
                contrast +
                128
            ) * brightness;

        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );

        if (invert) {
            gray = 255 - gray;
        }

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }

    pCtx.putImageData(
        image,
        0,
        0
    );

    invalidateAudio();

}


document.getElementById(
    "contrast"
).addEventListener(
    "input",
    e => {

        document.getElementById(
            "contrast-val"
        ).textContent =
            parseFloat(
                e.target.value
            ).toFixed(2);

        applyFilters();

    }
);


document.getElementById(
    "brightness"
).addEventListener(
    "input",
    e => {

        document.getElementById(
            "brightness-val"
        ).textContent =
            parseFloat(
                e.target.value
            ).toFixed(2);

        applyFilters();

    }
);


document.getElementById(
    "invert-bw"
).addEventListener(
    "change",
    applyFilters
);


/* =========================================================
   MOTEURS
========================================================= */

const engineSelect =
    document.getElementById(
        "engine-select"
    );

const engineDescription =
    document.getElementById(
        "engine-description"
    );


const descriptions = {

    spectral:
        "Le dessin est analysé comme un ensemble de composantes fréquentielles réparties verticalement.",

    mclaren:
        "La position verticale du dessin détermine la hauteur du son pendant son déplacement horizontal.",

    density:
        "La quantité de matière graphique rencontrée détermine la densité du son."

};


engineSelect.addEventListener(
    "change",
    () => {

        const engine =
            engineSelect.value;

        document.getElementById(
            "ans-controls"
        ).style.display =
            engine === "spectral"
                ? "block"
                : "none";

        document.getElementById(
            "mclaren-controls"
        ).style.display =
            engine === "mclaren"
                ? "block"
                : "none";

        engineDescription.textContent =
            descriptions[engine];

        invalidateAudio();

    }
);


document.getElementById(
    "duration"
).addEventListener(
    "input",
    e => {

        document.getElementById(
            "duration-val"
        ).textContent =
            e.target.value;

        invalidateAudio();

    }
);


document.getElementById(
    "nbins"
).addEventListener(
    "input",
    e => {

        document.getElementById(
            "bins-val"
        ).textContent =
            e.target.value;

        invalidateAudio();

    }
);


[
    "fmin",
    "fmax",
    "mclaren-freq"
].forEach(
    id => {

        document.getElementById(
            id
        ).addEventListener(
            "input",
            invalidateAudio
        );

    }
);


document.getElementById(
    "invert-freq"
).addEventListener(
    "change",
    invalidateAudio
);


/* =========================================================
   SIGNATURE
========================================================= */

function getSettingsSignature() {

    return JSON.stringify({

        engine:
            engineSelect.value,

        duration:
            document.getElementById(
                "duration"
            ).value,

        fmin:
            document.getElementById(
                "fmin"
            ).value,

        fmax:
            document.getElementById(
                "fmax"
            ).value,

        bins:
            document.getElementById(
                "nbins"
            ).value,

        base:
            document.getElementById(
                "mclaren-freq"
            ).value,

        invertFreq:
            document.getElementById(
                "invert-freq"
            ).checked

    });

}


/* =========================================================
   ANALYSE DU DESSIN
========================================================= */

function analyseColumns(
    numberOfColumns = 800
) {

    const image =
        pCtx.getImageData(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        );

    const data =
        image.data;

    const w =
        paintCanvas.width;

    const h =
        paintCanvas.height;

    const columns =
        new Array(
            numberOfColumns
        );


    for (
        let cx = 0;
        cx < numberOfColumns;
        cx++
    ) {

        const x =
            Math.floor(
                cx *
                (w - 1) /
                (numberOfColumns - 1)
            );

        let density = 0;
        let weightedY = 0;

        for (
            let y = 0;
            y < h;
            y++
        ) {

            const index =
                (y * w + x) * 4;

            const ink =
                1 -
                data[index] / 255;

            if (
                ink > 0.03
            ) {

                density += ink;

                weightedY +=
                    y * ink;

            }

        }

        if (
            density > 0
        ) {

            columns[cx] = {

                density:
                    Math.min(
                        1,
                        density / h
                    ),

                centroid:
                    weightedY /
                    density /
                    h

            };

        } else {

            columns[cx] = {

                density: 0,
                centroid: 0.5

            };

        }

    }


    /*
     * Lissage léger.
     */

    const smooth = [];

    for (
        let x = 0;
        x < numberOfColumns;
        x++
    ) {

        let d = 0;
        let y = 0;
        let count = 0;

        for (
            let k = -1;
            k <= 1;
            k++
        ) {

            const index =
                x + k;

            if (
                index >= 0 &&
                index < numberOfColumns
            ) {

                d +=
                    columns[index]
                        .density;

                y +=
                    columns[index]
                        .centroid;

                count++;

            }

        }

        smooth[x] = {

            density:
                d / count,

            centroid:
                y / count

        };

    }

    return smooth;

}


/* =========================================================
   GENERATION AUDIO
========================================================= */

async function generateAudio() {

    await initAudio();

    const signature =
        getSettingsSignature();

    if (
        lastAudioBuffer &&
        lastSettingsSignature ===
        signature
    ) {

        return lastAudioBuffer;

    }

    setProgress(5);

    const duration =
        parseFloat(
            document.getElementById(
                "duration"
            ).value
        );

    const sampleRate =
        audioCtx.sampleRate;

    const totalSamples =
        Math.floor(
            sampleRate *
            duration
        );

    const columns =
        analyseColumns(800);

    setProgress(15);

    const buffer =
        audioCtx.createBuffer(
            1,
            totalSamples,
            sampleRate
        );

    const channel =
        buffer.getChannelData(0);

    const engine =
        engineSelect.value;

    const invertFreq =
        document.getElementById(
            "invert-freq"
        ).checked;


    /* =====================================================
       SPECTRAL
    ====================================================== */

    if (
        engine === "spectral"
    ) {

        let fmin =
            parseFloat(
                document.getElementById(
                    "fmin"
                ).value
            ) || 80;

        let fmax =
            parseFloat(
                document.getElementById(
                    "fmax"
                ).value
            ) || 4000;

        let nBins =
            parseInt(
                document.getElementById(
                    "nbins"
                ).value
            ) || 40;

        fmin =
            Math.max(
                20,
                fmin
            );

        fmax =
            Math.max(
                fmin + 1,
                fmax
            );

        nBins =
            Math.max(
                2,
                nBins
            );


        for (
            let b = 0;
            b < nBins;
            b++
        ) {

            const normalized =
                b /
                (nBins - 1);

            const frequencyIndex =
                invertFreq
                    ? 1 - normalized
                    : normalized;

            const y =
                frequencyIndex;

            const frequency =
                fmin *
                Math.pow(
                    fmax / fmin,
                    frequencyIndex
                );

            let phase = 0;

            const phaseIncrement =
                2 *
                Math.PI *
                frequency /
                sampleRate;


            for (
                let i = 0;
                i < totalSamples;
                i++
            ) {

                const position =
                    i /
                    (totalSamples - 1);

                const columnIndex =
                    Math.min(
                        columns.length - 1,
                        Math.floor(
                            position *
                            (
                                columns.length - 1
                            )
                        )
                    );

                const column =
                    columns[columnIndex];

                /*
                 * La position verticale du bin
                 * influence directement la présence
                 * de cette composante.
                 */

                const verticalPosition =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            y
                        )
                    );

                /*
                 * Le point du dessin situé à cette
                 * hauteur est estimé à partir du
                 * profil local.
                 *
                 * La densité sert de matière sonore.
                 */

                let amp =
                    column.density;

                /*
                 * Une légère pondération selon la
                 * position verticale évite que toutes
                 * les bandes soient strictement identiques.
                 */

                amp *=
                    0.35 +
                    0.65 *
                    (
                        1 -
                        Math.abs(
                            column.centroid -
                            verticalPosition
                        )
                    );

                channel[i] +=
                    Math.sin(phase) *
                    amp /
                    Math.sqrt(nBins);

                phase +=
                    phaseIncrement;

            }

            setProgress(
                15 +
                65 *
                (
                    (b + 1) /
                    nBins
                )
            );

        }

    }


    /* =====================================================
       MCLAREN
    ====================================================== */

    else if (
        engine === "mclaren"
    ) {

        const baseFreq =
            Math.max(
                20,
                parseFloat(
                    document.getElementById(
                        "mclaren-freq"
                    ).value
                ) || 220
            );

        let phase = 0;

        for (
            let i = 0;
            i < totalSamples;
            i++
        ) {

            const position =
                i /
                (totalSamples - 1);

            const index =
                Math.min(
                    columns.length - 1,
                    Math.floor(
                        position *
                        (
                            columns.length - 1
                        )
                    )
                );

            const current =
                columns[index];

            let normalizedY =
                0.5 -
                current.centroid;

            if (invertFreq) {
                normalizedY =
                    -normalizedY;
            }

            const frequency =
                baseFreq *
                Math.pow(
                    2,
                    normalizedY * 2
                );

            phase +=
                2 *
                Math.PI *
                frequency /
                sampleRate;

            const amp =
                Math.min(
                    1,
                    current.density * 8
                );

            channel[i] =
                Math.sin(phase) *
                amp;

            if (
                i % 50000 === 0
            ) {

                setProgress(
                    15 +
                    65 *
                    (
                        i /
                        totalSamples
                    )
                );

            }

        }

    }


    /* =====================================================
       VARIABLE DENSITY
    ====================================================== */

    else {

        let seed =
            123456789;

        function random() {

            seed =
                (
                    1664525 *
                    seed +
                    1013904223
                ) >>> 0;

            return (
                seed /
                4294967296
            );

        }

        let noise = 0;

        for (
            let i = 0;
            i < totalSamples;
            i++
        ) {

            const position =
                i /
                (totalSamples - 1);

            const index =
                Math.min(
                    columns.length - 1,
                    Math.floor(
                        position *
                        (
                            columns.length - 1
                        )
                    )
                );

            const density =
                columns[index].density;

            noise =
                noise * 0.96 +
                random() * 0.04;

            channel[i] =
                (
                    noise * 2 - 1
                ) *
                Math.min(
                    1,
                    density * 10
                );

            if (
                i % 50000 === 0
            ) {

                setProgress(
                    15 +
                    65 *
                    (
                        i /
                        totalSamples
                    )
                );

            }

        }

    }


    /* =====================================================
       NORMALISATION
    ====================================================== */

    let maxAmp = 0;

    for (
        let i = 0;
        i < totalSamples;
        i++
    ) {

        maxAmp =
            Math.max(
                maxAmp,
                Math.abs(
                    channel[i]
                )
            );

    }


    if (
        maxAmp > 0
    ) {

        for (
            let i = 0;
            i < totalSamples;
            i++
        ) {

            channel[i] =
                channel[i] /
                maxAmp *
                0.82;

        }

    }


    /* =====================================================
       FADE
    ====================================================== */

    const fadeSamples =
        Math.min(
            Math.floor(
                sampleRate * 0.025
            ),
            Math.floor(
                totalSamples / 2
            )
        );


    for (
        let i = 0;
        i < fadeSamples;
        i++
    ) {

        const factor =
            i /
            fadeSamples;

        channel[i] *=
            factor;

        channel[
            totalSamples -
            1 -
            i
        ] *=
            factor;

    }


    lastAudioBuffer =
        buffer;

    lastSettingsSignature =
        signature;

    setProgress(100);

    return buffer;

}


/* =========================================================
   LECTURE
========================================================= */

async function playAudio() {

    await initAudio();

    stopPlayback(false);

    setStatus(
        "Calcul de l'audio…"
    );

    try {

        const buffer =
            await generateAudio();

        currentSource =
            audioCtx.createBufferSource();

        currentSource.buffer =
            buffer;


        const gain =
            audioCtx.createGain();

        gain.gain.value =
            0.85;


        const compressor =
            audioCtx
                .createDynamicsCompressor();

        compressor.threshold.value =
            -12;

        compressor.knee.value =
            18;

        compressor.ratio.value =
            3;

        compressor.attack.value =
            0.003;

        compressor.release.value =
            0.2;


        currentSource.connect(
            gain
        );

        gain.connect(
            compressor
        );

        compressor.connect(
            audioCtx.destination
        );


        playbackStartTime =
            audioCtx.currentTime;

        playbackDuration =
            buffer.duration;


        currentSource.onended =
            () => {

                currentSource =
                    null;

                setAudioState(
                    "ready"
                );

                setStatus(
                    "Lecture terminée."
                );

                stopScan();

            };


        currentSource.start();

        setAudioState(
            "playing"
        );

        setStatus(
            "Lecture en cours…"
        );

        animateScan();

    } catch (error) {

        console.error(error);

        setStatus(
            "Impossible de générer le son."
        );

    }

}


function stopPlayback(
    updateStatus = true
) {

    if (currentSource) {

        try {

            currentSource.onended =
                null;

            currentSource.stop();

        } catch (e) {}

        currentSource =
            null;

    }

    stopScan();

    setAudioState(
        "ready"
    );

    if (updateStatus) {

        setStatus(
            "Arrêté."
        );

    }

}


document.getElementById(
    "btn-play"
).addEventListener(
    "click",
    playAudio
);


document.getElementById(
    "btn-stop"
).addEventListener(
    "click",
    () => stopPlayback(true)
);


/* =========================================================
   BALAYAGE
========================================================= */

function animateScan() {

    if (!currentSource) {
        return;
    }

    const elapsed =
        audioCtx.currentTime -
        playbackStartTime;

    const progress =
        Math.min(
            1,
            elapsed /
            playbackDuration
        );

    const line =
        document.getElementById(
            "scan-line"
        );

    line.style.display =
        "block";

    line.style.left =
        (
            progress *
            100
        ) + "%";


    if (
        progress < 1
    ) {

        animationFrame =
            requestAnimationFrame(
                animateScan
            );

    } else {

        stopScan();

    }

}


function stopScan() {

    if (animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }

    document.getElementById(
        "scan-line"
    ).style.display =
        "none";

}

========================================================= */

document.getElementById(

function showSpectrogram(
    buffer
) {

    const modal =
        document.getElementById(
            "modal-spectro"
        );

    modal.classList.add(
        "visible"
    );

    const canvas =
        document.getElementById(
            "spectroCanvas"
        );

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio ||
        1;

    canvas.width =
        Math.floor(
            rect.width * dpr
        );

    canvas.height =
        Math.floor(
            rect.height * dpr
        );

    const ctx =
        canvas.getContext("2d");

    ctx.scale(
        dpr,
        dpr
    );

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.fillStyle =
        "#050505";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
     * Visualisation fréquentielle.
     */

    const data =
        buffer.getChannelData(0);

    const fftSize =
        1024;

    const columns =
        Math.floor(width);

    const bins =
        Math.floor(
            fftSize / 2
        );


    /*
     * Pour rester raisonnable sur téléphone,
     * on utilise un sous-échantillonnage.
     */

    for (
        let x = 0;
        x < columns;
        x++
    ) {

        const center =
            Math.floor(
                x *
                (
                    data.length -
                    fftSize
                ) /
                Math.max(
                    1,
                    columns - 1
                )
            );


        for (
            let b = 0;
            b < bins;
            b++
        ) {

            let real = 0;
            let imag = 0;

            const frequency =
                b / fftSize;


            for (
                let n = 0;
                n < fftSize;
                n += 8
            ) {

                const sample =
                    data[
                        center + n
                    ] || 0;

                const angle =
                    2 *
                    Math.PI *
                    frequency *
                    n;

                real +=
                    sample *
                    Math.cos(angle);

                imag -=
                    sample *
                    Math.sin(angle);

            }


            const magnitude =
                Math.sqrt(
                    real * real +
                    imag * imag
                ) / 128;


            if (
                magnitude > 0.015
            ) {

                const intensity =
                    Math.min(
                        1,
                        magnitude * 5
                    );

                const r =
                    Math.floor(
                        35 +
                        90 *
                        intensity
                    );

                const g =
                    Math.floor(
                        55 +
                        130 *
                        intensity
                    );

                const bcol =
                    Math.floor(
                        70 +
                        160 *
                        intensity
                    );

                ctx.fillStyle =
                    `rgb(${r},${g},${bcol})`;

                ctx.fillRect(
                    x,
                    height -
                    (
                        b /
                        bins
                    ) *
                    height,
                    1,
                    Math.max(
                        1,
                        height /
                        bins
                    )
                );

            }

        }

    }

}

document.getElementById(
    "btn-export-wav"
).addEventListener(
    "click",
    async () => {

        setStatus(
            "Préparation du WAV…"
        );

        try {

            const buffer =
                lastAudioBuffer ||
                await generateAudio();

            const wav =
                audioBufferToWav(
                    buffer
                );

            const blob =
                new Blob(
                    [wav],
                    {
                        type:
                            "audio/wav"
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                url;

            link.download =
                "dessin-sonore.wav";

            link.click();

            setTimeout(
                () => {
                    URL.revokeObjectURL(
                        url
                    );
                },
                1000
            );

            setStatus(
                "Son exporté en WAV."
            );

        } catch (error) {

            console.error(error);

            setStatus(
                "Impossible d'exporter le WAV."
            );

        }

    }
);


/* =========================================================
   ENCODAGE WAV
========================================================= */

function audioBufferToWav(
    buffer
) {

    const channels =
        buffer.numberOfChannels;

    const sampleRate =
        buffer.sampleRate;

    const length =
        buffer.length *
        channels *
        2;

    const arrayBuffer =
        new ArrayBuffer(
            44 + length
        );

    const view =
        new DataView(
            arrayBuffer
        );


    function writeString(
        offset,
        string
    ) {

        for (
            let i = 0;
            i < string.length;
            i++
        ) {

            view.setUint8(
                offset + i,
                string.charCodeAt(i)
            );

        }

    }


    writeString(
        0,
        "RIFF"
    );

    view.setUint32(
        4,
        36 + length,
        true
    );

    writeString(
        8,
        "WAVE"
    );

    writeString(
        12,
        "fmt "
    );

    view.setUint32(
        16,
        16,
        true
    );

    view.setUint16(
        20,
        1,
        true
    );

    view.setUint16(
        22,
        channels,
        true
    );

    view.setUint32(
        24,
        sampleRate,
        true
    );

    view.setUint32(
        28,
        sampleRate *
        channels *
        2,
        true
    );

    view.setUint16(
        32,
        channels * 2,
        true
    );

    view.setUint16(
        34,
        16,
        true
    );

    writeString(
        36,
        "data"
    );

    view.setUint32(
        40,
        length,
        true
    );


    const channelData = [];

    for (
        let c = 0;
        c < channels;
        c++
    ) {

        channelData.push(
            buffer.getChannelData(c)
        );

    }


    let offset = 44;


    for (
        let i = 0;
        i < buffer.length;
        i++
    ) {

        for (
            let c = 0;
            c < channels;
            c++
        ) {

            let sample =
                channelData[c][i];

            sample =
                Math.max(
                    -1,
                    Math.min(
                        1,
                        sample
                    )
                );

            sample =
                sample < 0
                    ? sample * 0x8000
                    : sample * 0x7fff;

            view.setInt16(
                offset,
                sample,
                true
            );

            offset += 2;

        }

    }

    return arrayBuffer;

}


/* =========================================================
   RACCOURCIS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.ctrlKey &&
            event.key.toLowerCase() ===
            "z"
        ) {

            event.preventDefault();

            if (event.shiftKey) {
                redo();
            } else {
                undo();
            }

        }


        if (
            event.code === "Space" &&
            event.target.tagName !==
            "INPUT" &&
            event.target.tagName !==
            "SELECT"
        ) {

            event.preventDefault();

            if (currentSource) {

                stopPlayback(true);

            } else {

                playAudio();

            }

        }


        if (
            event.key === "Escape"
        ) {

            document.getElementById(
                "modal-spectro"
            ).classList.remove(
                "visible"
            );

        }

    }
);
