<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dessin Sonore — V3.9</title>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: Arial, Helvetica, sans-serif; min-height: 100vh; }
header { padding: 16px 20px 10px; border-bottom: 1px solid #333; }
h1 { margin: 0; font-size: 22px; font-weight: 500; }
.version { color: #888; font-size: 12px; margin-top: 4px; }

.controls {
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid #333;
    background: #141414;
}

.group { display: flex; align-items: center; gap: 7px; }
label { font-size: 13px; color: #bbb; }
button, select, input[type="number"], input[type="range"] { font: inherit; }
button, select, input[type="number"] {
    background: #222; color: #eee; border: 1px solid #555; border-radius: 5px; padding: 7px 10px; cursor: pointer;
}
button:hover { background: #303030; }
button.active { background: #0055cc; border-color: #0077ff; }
input[type="range"] { width: 90px; }

main { max-width: 1100px; margin: auto; padding: 18px; }
.canvas-wrap { width: 100%; display: flex; justify-content: center; }
.canvas-stage { position: relative; width: 100%; max-width: 900px; }

#canvas, #readingCanvas {
    width: 100%;
    max-width: 900px;
    height: auto;
    display: block;
    aspect-ratio: 900 / 650;
}

#canvas {
    background: white;
    border: 1px solid #444;
    touch-action: none;
    cursor: crosshair;
}

#readingCanvas {
    position: absolute;
    left: 0;
    top: 0;
    border: 0;
    background: transparent;
    pointer-events: none;
}

.read-controls {
    width: 100%;
    max-width: 900px;
    margin: 9px auto 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.info { margin-top: 12px; color: #999; font-size: 13px; line-height: 1.5; }
.advanced { display: none; padding: 12px 20px; border-bottom: 1px solid #333; background: #171717; }
.advanced.visible { display: flex; flex-wrap: wrap; gap: 15px; }
.status { margin-top: 8px; font-size: 12px; color: #777; }

/* MODAL SPECTROGRAMME */
.spectrogram-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.88);
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.spectrogram-modal.visible { display: flex; }
.spectrogram-box {
    width: min(1000px, 96vw);
    max-height: 92vh;
    background: #171717;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
}
.spectrogram-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 12px; }

#spectrogramCanvas, #waveformCanvas {
    width: 100%;
    height: auto;
    display: block;
    background: #000;
    border: 1px solid #444;
}
</style>
</head>
<body>

<header>
    <h1>Dessin Sonore</h1>
    <div class="version">V3.9 — Moteurs distincts, Gomme & Épaisseur réglable</div>
</header>

<div class="controls">
    <!-- OUTILS DE DESSIN -->
    <div class="group">
        <button id="toolDraw" class="active">✏️ Crayon</button>
        <button id="toolErase">🧽 Gomme</button>
    </div>

    <div class="group">
        <label>Taille</label>
        <input id="brushSize" type="range" min="1" max="50" value="6">
        <span id="brushSizeVal" style="font-size:12px; color:#aaa; min-width:24px;">6px</span>
    </div>

    <!-- MOTEURS ET RÉGLAGES AUDIO -->
    <div class="group">
        <label>Moteur</label>
        <select id="mode">
            <option value="spectral">Pixels (Synthèse additive)</option>
            <option value="contours">Contours (Ligne mélodique)</option>
            <option value="mclaren">McLaren (Trajectoire & Pente)</option>
            <option value="density">Masse (Synthèse granulaire)</option>
        </select>
    </div>

    <div class="group">
        <label>Gamme</label>
        <select id="scale">
            <option value="free">Libre</option>
            <option value="chromatic">Chromatique</option>
            <option value="major">Majeure</option>
            <option value="minor">Mineure</option>
            <option value="pentatonic">Pentatonique</option>
        </select>
    </div>

    <div class="group">
        <label>Durée</label>
        <input id="duration" type="number" value="8" min="1" max="60" step="0.5">
        <span style="font-size:12px;color:#888">s</span>
    </div>

    <div class="group">
        <label>Volume</label>
        <input id="volume" type="range" min="0" max="1" value="0.65" step="0.01">
    </div>

    <button id="play">▶ Lecture</button>
    <button id="stop">■ Stop</button>
    <button id="clear">Tout effacer</button>
    <button id="spectrogram">Spectrogramme</button>

    <div class="group">
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button id="advancedBtn">Avancé</button>
</div>

<div id="advanced" class="advanced">
    <div class="group"><label>F min</label><input id="fmin" type="number" value="110" min="20" max="2000"></div>
    <div class="group"><label>F max</label><input id="fmax" type="number" value="880" min="50" max="5000"></div>
    <div class="group"><label>Bins (Résolution)</label><input id="bins" type="number" value="128" min="32" max="512"></div>
</div>

<main>
    <div class="canvas-wrap">
        <div class="canvas-stage">
            <canvas id="canvas" width="900" height="650"></canvas>
            <canvas id="readingCanvas" width="900" height="650"></canvas>
        </div>
    </div>

    <div class="read-controls">
        <button id="playUnder">▶ Lecture</button>
        <button id="stopUnder">■ Stop</button>
    </div>

    <div id="status" class="status">Prêt.</div>
</main>

<!-- SPECTROGRAMME MODAL -->
<div id="spectrogramModal" class="spectrogram-modal">
    <div class="spectrogram-box">
        <div class="spectrogram-header">
            <h3>Analyse du signal audio</h3>
            <button id="closeSpectrogram">Fermer</button>
        </div>
        <canvas id="waveformCanvas" width="900" height="150"></canvas>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const readingCanvas = document.getElementById("readingCanvas");
const readingCtx = readingCanvas.getContext("2d");

const modeSelect = document.getElementById("mode");
const scaleSelect = document.getElementById("scale");
const durationInput = document.getElementById("duration");
const volumeInput = document.getElementById("volume");
const fminInput = document.getElementById("fmin");
const fmaxInput = document.getElementById("fmax");
const binsInput = document.getElementById("bins");

const toolDraw = document.getElementById("toolDraw");
const toolErase = document.getElementById("toolErase");
const brushSize = document.getElementById("brushSize");
const brushSizeVal = document.getElementById("brushSizeVal");

const status = document.getElementById("status");
const advancedBtn = document.getElementById("advancedBtn");
const advanced = document.getElementById("advanced");
const imageInput = document.getElementById("imageInput");

const playBtn = document.getElementById("play");
const stopBtn = document.getElementById("stop");
const clearBtn = document.getElementById("clear");
const spectrogramBtn = document.getElementById("spectrogram");
const playUnderBtn = document.getElementById("playUnder");
const stopUnderBtn = document.getElementById("stopUnder");

const spectrogramModal = document.getElementById("spectrogramModal");
const closeSpectrogramBtn = document.getElementById("closeSpectrogram");
const waveformCanvas = document.getElementById("waveformCanvas");
const waveformCtx = waveformCanvas.getContext("2d");

let audioContext = null;
let currentSource = null;
let lastAudioBuffer = null;
let playbackStartedAt = 0;
let playbackDuration = 0;
let animationFrame = null;

let isErasing = false;
let drawing = false;
let activePointerId = null;
let lastX = 0, lastY = 0;

function initCanvas() {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    clearReadingLine();
}
initCanvas();

/* --- BOUTONS OUTILS --- */
toolDraw.addEventListener("click", () => {
    isErasing = false;
    toolDraw.classList.add("active");
    toolErase.classList.remove("active");
});

toolErase.addEventListener("click", () => {
    isErasing = true;
    toolErase.classList.add("active");
    toolDraw.classList.remove("active");
});

brushSize.addEventListener("input", (e) => {
    brushSizeVal.textContent = e.target.value + "px";
});

/* --- LIGNE DE LECTURE --- */
function clearReadingLine() {
    readingCtx.clearRect(0, 0, readingCanvas.width, readingCanvas.height);
}

function drawReadingLine(progress) {
    clearReadingLine();
    if (progress < 0 || progress > 1) return;
    const x = progress * readingCanvas.width;
    readingCtx.save();
    readingCtx.strokeStyle = "#ff0044";
    readingCtx.lineWidth = 2;
    readingCtx.beginPath();
    readingCtx.moveTo(x, 0);
    readingCtx.lineTo(x, readingCanvas.height);
    readingCtx.stroke();
    readingCtx.restore();
}

function animateReadingLine() {
    if (!currentSource || playbackDuration <= 0) {
        clearReadingLine();
        animationFrame = null;
        return;
    }
    const elapsed = (performance.now() - playbackStartedAt) / 1000;
    const progress = Math.max(0, Math.min(1, elapsed / playbackDuration));
    drawReadingLine(progress);

    if (progress < 1 && currentSource) {
        animationFrame = requestAnimationFrame(animateReadingLine);
    } else {
        clearReadingLine();
        animationFrame = null;
    }
}

function startReadingAnimation() {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    playbackStartedAt = performance.now();
    animationFrame = requestAnimationFrame(animateReadingLine);
}

function stopReadingAnimation() {
    if (animationFrame) { cancelAnimationFrame(animationFrame); animationFrame = null; }
    clearReadingLine();
}

/* --- DESSIN --- */
function canvasPosition(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: Math.max(0, Math.min(canvas.width, (clientX - rect.left) * (canvas.width / rect.width))),
        y: Math.max(0, Math.min(canvas.height, (clientY - rect.top) * (canvas.height / rect.height)))
    };
}

function beginDrawing(event) {
    event.preventDefault();
    drawing = true;
    activePointerId = event.pointerId;
    try { canvas.setPointerCapture(event.pointerId); } catch (e) {}

    const p = canvasPosition(event.clientX, event.clientY);
    lastX = p.x; lastY = p.y;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Number(brushSize.value);
    ctx.strokeStyle = isErasing ? "white" : "black";
    ctx.lineTo(p.x + 0.01, p.y + 0.01);
    ctx.stroke();
}

function draw(event) {
    if (!drawing || (activePointerId !== null && event.pointerId !== activePointerId)) return;
    event.preventDefault();
    const p = canvasPosition(event.clientX, event.clientY);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Number(brushSize.value);
    ctx.strokeStyle = isErasing ? "white" : "black";
    ctx.stroke();
    lastX = p.x; lastY = p.y;
}

function endDrawing(event) {
    if (activePointerId !== null && event.pointerId !== activePointerId) return;
    event.preventDefault();
    drawing = false;
    try { canvas.releasePointerCapture(event.pointerId); } catch (e) {}
    activePointerId = null;
}

canvas.addEventListener("pointerdown", beginDrawing, { passive: false });
canvas.addEventListener("pointermove", draw, { passive: false });
canvas.addEventListener("pointerup", endDrawing, { passive: false });
canvas.addEventListener("pointercancel", endDrawing, { passive: false });

clearBtn.addEventListener("click", () => {
    stopAudio();
    initCanvas();
    lastAudioBuffer = null;
    imageInput.value = "";
    status.textContent = "Dessin effacé.";
});

imageInput.addEventListener("change", event => {
    const file = event.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * ratio, h = img.height * ratio;
        const x = (canvas.width - w) / 2, y = (canvas.height - h) / 2;
        ctx.drawImage(img, x, y, w, h);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
            data[i] = data[i+1] = data[i+2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);
        clearReadingLine();
        lastAudioBuffer = null;
        status.textContent = "Image chargée.";
    };
    img.src = URL.createObjectURL(file);
});

advancedBtn.addEventListener("click", () => advanced.classList.toggle("visible"));

/* --- DÉFINITION DES GAMMES ET FREQUENCES --- */
function darkness(data, index) {
    const luminance = 0.299 * data[index] + 0.587 * data[index+1] + 0.114 * data[index+2];
    return 1 - luminance / 255;
}

function frequencyFromY(y) {
    const fmin = Number(fminInput.value);
    const fmax = Number(fmaxInput.value);
    const normalized = 1 - y / canvas.height;
    const scale = scaleSelect.value;
    let freq = fmin * Math.pow(fmax / fmin, normalized);

    if (scale === "free") return freq;

    const midi = 69 + 12 * Math.log2(freq / 440);
    let note;
    if (scale === "chromatic") {
        note = Math.round(midi);
    } else {
        let intervals = scale === "major" ? [0,2,4,5,7,9,11] : scale === "minor" ? [0,2,3,5,7,8,10] : [0,2,4,7,9];
        let octave = Math.floor(midi / 12);
        let within = ((midi % 12) + 12) % 12;
        let closest = intervals.reduce((prev, curr) => Math.abs(curr - within) < Math.abs(prev - within) ? curr : prev);
        note = octave * 12 + closest;
    }
    return 440 * Math.pow(2, (note - 69) / 12);
}

/* --- LOGIQUE DISTINCTE DES 4 MOTEURS --- */
function processAudioEngine(ac, duration) {
    const samplesCount = Number(binsInput.value);
    const length = Math.floor(duration * ac.sampleRate);
    const buffer = ac.createBuffer(1, length, ac.sampleRate);
    const output = buffer.getChannelData(0);
    const mode = modeSelect.value;

    // --- MOTEUR 1 : PIXELS (Synthèse Additive Pure) ---
    if (mode === "spectral") {
        const numOsc = 64; // Nombre de bandes de hauteur
        const oscPhases = new Float32Array(numOsc);
        
        for (let i = 0; i < length; i++) {
            const progress = i / length;
            const x = Math.floor(progress * canvas.width);
            const colData = ctx.getImageData(x, 0, 1, canvas.height).data;
            
            let sampleAcc = 0;
            let activeCount = 0;

            for (let osc = 0; osc < numOsc; osc++) {
                const y = Math.floor((1 - (osc / numOsc)) * canvas.height);
                const dark = darkness(colData, y * 4);
                if (dark > 0.05) {
                    const freq = frequencyFromY(y);
                    oscPhases[osc] += (freq / ac.sampleRate);
                    sampleAcc += Math.sin(oscPhases[osc] * Math.PI * 2) * dark;
                    activeCount++;
                }
            }
            output[i] = activeCount > 0 ? (sampleAcc / Math.sqrt(activeCount)) * 0.3 : 0;
        }
    } 

    // --- MOTEUR 2 : CONTOURS (Ligne Mélodique Unifiée) ---
    else if (mode === "contours") {
        let phase = 0;
        let currentFreq = 0;

        for (let i = 0; i < length; i++) {
            const progress = i / length;
            const x = Math.floor(progress * canvas.width);
            const colData = ctx.getImageData(x, 0, 1, canvas.height).data;

            // Détection du point le plus foncé (ligne principale)
            let maxDark = 0, bestY = -1;
            for (let y = 0; y < canvas.height; y += 2) {
                const dark = darkness(colData, y * 4);
                if (dark > maxDark) { maxDark = dark; bestY = y; }
            }

            if (bestY !== -1 && maxDark > 0.1) {
                const targetFreq = frequencyFromY(bestY);
                currentFreq += (targetFreq - currentFreq) * 0.05; // Glissando fluide
                phase += currentFreq / ac.sampleRate;
                // Onde triangle douce
                output[i] = (1 - 4 * Math.abs((phase % 1) - 0.5)) * maxDark * 0.6;
            } else {
                output[i] = 0;
            }
        }
    }

    // --- MOTEUR 3 : McLAREN (Orientation, Pente & Trajectoire) ---
    else if (mode === "mclaren") {
        let phase = 0;
        let lastY = canvas.height / 2;

        for (let i = 0; i < length; i++) {
            const progress = i / length;
            const x = Math.floor(progress * canvas.width);
            const colData = ctx.getImageData(x, 0, 1, canvas.height).data;

            let weightedY = 0, totalDark = 0;
            for (let y = 0; y < canvas.height; y += 4) {
                const dark = darkness(colData, y * 4);
                if (dark > 0.1) { weightedY += y * dark; totalDark += dark; }
            }

            if (totalDark > 0) {
                const currentY = weightedY / totalDark;
                const slope = (lastY - currentY); // Pente de la ligne
                lastY = currentY;

                const baseFreq = frequencyFromY(currentY);
                phase += baseFreq / ac.sampleRate;
                
                // La pente modifie la richesse harmonique (Bite / Timbre)
                const harmonic = Math.sin(phase * Math.PI * 2) + Math.sin(phase * Math.PI * 4) * Math.min(1, Math.abs(slope) * 0.2);
                output[i] = harmonic * Math.min(1, totalDark * 0.05) * 0.5;
            } else {
                output[i] = 0;
            }
        }
    }

    // --- MOTEUR 4 : MASSE (Nuage Granulaire basé sur la densité) ---
    else if (mode === "density") {
        for (let i = 0; i < length; i++) {
            const progress = i / length;
            const x = Math.floor(progress * canvas.width);
            const colData = ctx.getImageData(x, 0, 1, canvas.height).data;

            let darkCount = 0;
            for (let y = 0; y < canvas.height; y += 8) {
                if (darkness(colData, y * 4) > 0.1) darkCount++;
            }

            const density = darkCount / (canvas.height / 8);
            if (density > 0) {
                // Bruit filtré / granulaire
                const noise = (Math.random() * 2 - 1);
                output[i] = noise * density * 0.5;
            } else {
                output[i] = 0;
            }
        }
    }

    return buffer;
}

function ensureAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
}

async function playAudio() {
    stopAudio();
    status.textContent = "Calcul de la synthèse...";
    await new Promise(r => setTimeout(r, 20));

    const ac = ensureAudio();
    if (ac.state === "suspended") await ac.resume();

    const duration = Math.max(1, Math.min(60, Number(durationInput.value) || 8));
    const buffer = processAudioEngine(ac, duration);

    lastAudioBuffer = buffer;

    const source = ac.createBufferSource();
    const gain = ac.createGain();
    source.buffer = buffer;
    gain.gain.value = Number(volumeInput.value);
    source.connect(gain);
    gain.connect(ac.destination);

    playbackDuration = buffer.duration;
    currentSource = source;
    source.onended = () => {
        if (currentSource === source) {
            currentSource = null;
            stopReadingAnimation();
            status.textContent = "Lecture terminée.";
        }
    };

    source.start();
    status.textContent = "Lecture en cours (" + modeSelect.options[modeSelect.selectedIndex].text + ")…";
    startReadingAnimation();
}

function stopAudio() {
    stopReadingAnimation();
    if (currentSource) {
        try { currentSource.onended = null; currentSource.stop(); } catch (e) {}
        currentSource = null;
    }
}

playBtn.addEventListener("click", playAudio);
playUnderBtn.addEventListener("click", playAudio);
stopBtn.addEventListener("click", () => { stopAudio(); status.textContent = "Arrêté."; });
stopUnderBtn.addEventListener("click", () => { stopAudio(); status.textContent = "Arrêté."; });

spectrogramBtn.addEventListener("click", () => {
    if (!lastAudioBuffer) {
        const ac = ensureAudio();
        lastAudioBuffer = processAudioEngine(ac, Number(durationInput.value) || 8);
    }
    const data = lastAudioBuffer.getChannelData(0);
    const wCtx = waveformCtx;
    wCtx.fillStyle = "#111";
    wCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
    wCtx.strokeStyle = "#00ffcc";
    wCtx.beginPath();
    for (let x = 0; x < waveformCanvas.width; x++) {
        const idx = Math.floor(x * data.length / waveformCanvas.width);
        const y = (1 - data[idx]) * (waveformCanvas.height / 2);
        if (x === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    }
    wCtx.stroke();

    spectrogramModal.classList.add("visible");
});

closeSpectrogramBtn.addEventListener("click", () => spectrogramModal.classList.remove("visible"));
</script>
</body>
</html>
