<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dessin Sonore — V3.8</title>

<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: Arial, Helvetica, sans-serif; min-height: 100vh; }
header { padding: 16px 20px 10px; border-bottom: 1px solid #333; }
h1 { margin: 0; font-size: 22px; font-weight: 500; }
.version { color: #888; font-size: 12px; margin-top: 4px; }

.controls {
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 1px solid #333;
    background: #141414;
}

.group { display: flex; align-items: center; gap: 7px; }
label { font-size: 13px; color: #bbb; }
button, select, input[type="number"], input[type="range"] { font: inherit; }
button, select, input[type="number"] {
    background: #222; color: #eee; border: 1px solid #555; border-radius: 5px; padding: 7px 10px; cursor: pointer;
}
button:hover { background: #303030; }
input[type="range"] { width: 110px; }

main { max-width: 1100px; margin: auto; padding: 18px; }
.canvas-wrap { width: 100%; display: flex; justify-content: center; }
.canvas-stage { position: relative; width: 100%; max-width: 900px; }

#canvas, #readingCanvas {
    width: 100%;
    max-width: 900px;
    height: auto;
    display: block;
    aspect-ratio: 900 / 650;
}

#canvas {
    background: white;
    border: 1px solid #444;
    touch-action: none;
    cursor: crosshair;
}

#readingCanvas {
    position: absolute;
    left: 0;
    top: 0;
    border: 0;
    background: transparent;
    pointer-events: none;
}

.read-controls {
    width: 100%;
    max-width: 900px;
    margin: 9px auto 0;
    display: flex;
    align-items: center;
    gap: 8px;
}
.read-controls button { min-width: 105px; }

.info { margin-top: 12px; color: #999; font-size: 13px; line-height: 1.5; }
.advanced { display: none; padding: 12px 20px; border-bottom: 1px solid #333; background: #171717; }
.advanced.visible { display: flex; flex-wrap: wrap; gap: 15px; }
.status { margin-top: 8px; font-size: 12px; color: #777; }

/* SPECTROGRAMME MODAL */
.spectrogram-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.88);
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.spectrogram-modal.visible { display: flex; }
.spectrogram-box {
    width: min(1000px, 96vw);
    max-height: 92vh;
    background: #171717;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
}
.spectrogram-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 12px; }
.spectrogram-title { font-size: 17px; color: #eee; }
.spectrogram-description { color: #999; font-size: 12px; margin-bottom: 12px; }

#spectrogramCanvas, #waveformCanvas {
    width: 100%;
    height: auto;
    display: block;
    background: #fff;
    border: 1px solid #444;
}
.waveform-title { margin-top: 18px; margin-bottom: 8px; font-size: 13px; color: #bbb; }

@media (max-width: 700px) {
    header { padding: 12px 14px 8px; }
    main { padding: 10px; }
    .controls { padding: 10px 14px; }
}
</style>
</head>
<body>

<header>
    <h1>Dessin Sonore</h1>
    <div class="version">V3.8 — Optimisée & Corrigée</div>
</header>

<div class="controls">
    <div class="group">
        <label>Moteur</label>
        <select id="mode">
            <option value="spectral">Pixels</option>
            <option value="contours">Contours</option>
            <option value="mclaren">McLaren — trajectoire</option>
            <option value="density">Masse — champ musical</option>
        </select>
    </div>

    <div class="group">
        <label>Gamme</label>
        <select id="scale">
            <option value="free">Libre</option>
            <option value="chromatic">Chromatique</option>
            <option value="major">Majeure</option>
            <option value="minor">Mineure</option>
            <option value="pentatonic">Pentatonique</option>
        </select>
    </div>

    <div class="group">
        <label>Durée</label>
        <input id="duration" type="number" value="8" min="1" max="60" step="0.5">
        <span style="font-size:12px;color:#888">s</span>
    </div>

    <div class="group">
        <label>Volume</label>
        <input id="volume" type="range" min="0" max="1" value="0.65" step="0.01">
    </div>

    <div class="group">
        <label>Forme</label>
        <select id="waveform">
            <option value="sine">Sinus</option>
            <option value="triangle">Triangle</option>
            <option value="soft">Doux</option>
            <option value="harmonic">Harmonique</option>
        </select>
    </div>

    <button id="play">▶ Lecture</button>
    <button id="stop">■ Stop</button>
    <button id="clear">Effacer</button>
    <button id="spectrogram">Spectrogramme</button>

    <div class="group">
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button id="advancedBtn">Réglages avancés</button>
</div>

<div id="advanced" class="advanced">
    <div class="group"><label>F min</label><input id="fmin" type="number" value="110" min="20" max="2000"></div>
    <div class="group"><label>F max</label><input id="fmax" type="number" value="880" min="50" max="5000"></div>
    <div class="group"><label>Bins</label><input id="bins" type="number" value="128" min="32" max="512"></div>
    <div class="group"><label>McLaren sensibilité</label><input id="mclarenSensitivity" type="range" min="0" max="2" value="0.8" step="0.01"></div>
    <div class="group"><label>Masse richesse</label><input id="massRichness" type="range" min="0" max="1" value="0.55" step="0.01"></div>
</div>

<main>
    <div class="canvas-wrap">
        <div class="canvas-stage">
            <canvas id="canvas" width="900" height="650"></canvas>
            <canvas id="readingCanvas" width="900" height="650"></canvas>
        </div>
    </div>

    <div class="read-controls">
        <button id="playUnder">▶ Lecture</button>
        <button id="stopUnder">■ Stop</button>
    </div>

    <div class="info">
        <strong>Principe :</strong> Chaque moteur lit la trace visuelle selon une approche unique (spatiale, vectorielle ou granulaire).
    </div>

    <div id="status" class="status">Prêt.</div>
</main>

<!-- SPECTROGRAMME MODAL -->
<div id="spectrogramModal" class="spectrogram-modal">
    <div class="spectrogram-box">
        <div class="spectrogram-header">
            <div class="spectrogram-title">Analyse du signal audio</div>
            <button id="closeSpectrogram">Fermer</button>
        </div>
        <div class="spectrogram-description">Représentation temps-fréquence générée à partir du rendu audio réel.</div>
        <canvas id="spectrogramCanvas" width="900" height="420"></canvas>
        <div class="waveform-title">Forme d'onde</div>
        <canvas id="waveformCanvas" width="900" height="180"></canvas>
    </div>
</div>

<script>
/* =========================================================
   DESSIN SONORE — V3.8 (Logique consolidée)
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const readingCanvas = document.getElementById("readingCanvas");
const readingCtx = readingCanvas.getContext("2d");

const modeSelect = document.getElementById("mode");
const scaleSelect = document.getElementById("scale");
const durationInput = document.getElementById("duration");
const volumeInput = document.getElementById("volume");
const waveformSelect = document.getElementById("waveform");
const fminInput = document.getElementById("fmin");
const fmaxInput = document.getElementById("fmax");
const binsInput = document.getElementById("bins");
const mclarenSensitivity = document.getElementById("mclarenSensitivity");
const massRichness = document.getElementById("massRichness");

const status = document.getElementById("status");
const advancedBtn = document.getElementById("advancedBtn");
const advanced = document.getElementById("advanced");
const imageInput = document.getElementById("imageInput");

const playBtn = document.getElementById("play");
const stopBtn = document.getElementById("stop");
const clearBtn = document.getElementById("clear");
const spectrogramBtn = document.getElementById("spectrogram");
const playUnderBtn = document.getElementById("playUnder");
const stopUnderBtn = document.getElementById("stopUnder");

const spectrogramModal = document.getElementById("spectrogramModal");
const closeSpectrogramBtn = document.getElementById("closeSpectrogram");
const spectrogramCanvas = document.getElementById("spectrogramCanvas");
const spectrogramCtx = spectrogramCanvas.getContext("2d");
const waveformCanvas = document.getElementById("waveformCanvas");
const waveformCtx = waveformCanvas.getContext("2d");

let audioContext = null;
let currentSource = null;
let lastAudioBuffer = null;
let playbackStartedAt = 0;
let playbackDuration = 0;
let animationFrame = null;

let drawing = false;
let activePointerId = null;
let lastX = 0, lastY = 0;

function initCanvas() {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    clearReadingLine();
}
initCanvas();

/* --- LIGNE DE LECTURE --- */
function clearReadingLine() {
    readingCtx.clearRect(0, 0, readingCanvas.width, readingCanvas.height);
}

function drawReadingLine(progress) {
    clearReadingLine();
    if (progress < 0 || progress > 1) return;
    const x = progress * readingCanvas.width;
    readingCtx.save();
    readingCtx.strokeStyle = "#000";
    readingCtx.lineWidth = 2;
    readingCtx.globalAlpha = 0.75;
    readingCtx.beginPath();
    readingCtx.moveTo(x, 0);
    readingCtx.lineTo(x, readingCanvas.height);
    readingCtx.stroke();
    readingCtx.restore();
}

function animateReadingLine() {
    if (!currentSource || playbackDuration <= 0) {
        clearReadingLine();
        animationFrame = null;
        return;
    }
    const elapsed = (performance.now() - playbackStartedAt) / 1000;
    const progress = Math.max(0, Math.min(1, elapsed / playbackDuration));
    drawReadingLine(progress);

    if (progress < 1 && currentSource) {
        animationFrame = requestAnimationFrame(animateReadingLine);
    } else {
        clearReadingLine();
        animationFrame = null;
    }
}

function startReadingAnimation() {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    playbackStartedAt = performance.now();
    animationFrame = requestAnimationFrame(animateReadingLine);
}

function stopReadingAnimation() {
    if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }
    clearReadingLine();
}

/* --- GESTION DES COORDONNÉES --- */
function canvasPosition(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: Math.max(0, Math.min(canvas.width, (clientX - rect.left) * (canvas.width / rect.width))),
        y: Math.max(0, Math.min(canvas.height, (clientY - rect.top) * (canvas.height / rect.height)))
    };
}

/* --- DESSIN TACTILE/SOURIS --- */
function beginDrawing(event) {
    event.preventDefault();
    drawing = true;
    activePointerId = event.pointerId;
    try { canvas.setPointerCapture(event.pointerId); } catch (e) {}

    const p = canvasPosition(event.clientX, event.clientY);
    lastX = p.x; lastY = p.y;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = 4;
    ctx.strokeStyle = "black";
    ctx.lineTo(p.x + 0.01, p.y + 0.01);
    ctx.stroke();
}

function draw(event) {
    if (!drawing || (activePointerId !== null && event.pointerId !== activePointerId)) return;
    event.preventDefault();
    const p = canvasPosition(event.clientX, event.clientY);

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
}

function endDrawing(event) {
    if (activePointerId !== null && event.pointerId !== activePointerId) return;
    event.preventDefault();
    drawing = false;
    try { canvas.releasePointerCapture(event.pointerId); } catch (e) {}
    activePointerId = null;
}

canvas.addEventListener("pointerdown", beginDrawing, { passive: false });
canvas.addEventListener("pointermove", draw, { passive: false });
canvas.addEventListener("pointerup", endDrawing, { passive: false });
canvas.addEventListener("pointercancel", endDrawing, { passive: false });

/* --- EFFACER & IMAGE --- */
clearBtn.addEventListener("click", () => {
    stopAudio();
    initCanvas();
    lastAudioBuffer = null;
    imageInput.value = "";
    status.textContent = "Dessin effacé.";
});

imageInput.addEventListener("change", event => {
    const file = event.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * ratio, h = img.height * ratio;
        const x = (canvas.width - w) / 2, y = (canvas.height - h) / 2;
        ctx.drawImage(img, x, y, w, h);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
            data[i] = data[i+1] = data[i+2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);
        clearReadingLine();
        lastAudioBuffer = null;
        status.textContent = "Image chargée en noir et blanc.";
    };
    img.src = URL.createObjectURL(file);
});

advancedBtn.addEventListener("click", () => advanced.classList.toggle("visible"));

/* --- ANALYSE & MOTEURS SONORES --- */
function darkness(data, index) {
    const luminance = 0.299 * data[index] + 0.587 * data[index+1] + 0.114 * data[index+2];
    return 1 - luminance / 255;
}

function frequencyFromY(y) {
    const fmin = Number(fminInput.value);
    const fmax = Number(fmaxInput.value);
    const normalized = 1 - y / canvas.height;
    const scale = scaleSelect.value;
    let freq = fmin * Math.pow(fmax / fmin, normalized);

    if (scale === "free") return freq;

    const midi = 69 + 12 * Math.log2(freq / 440);
    let note;
    if (scale === "chromatic") {
        note = Math.round(midi);
    } else {
        let intervals = scale === "major" ? [0,2,4,5,7,9,11] : scale === "minor" ? [0,2,3,5,7,8,10] : [0,2,4,7,9];
        let octave = Math.floor(midi / 12);
        let within = ((midi % 12) + 12) % 12;
        let closest = intervals.reduce((prev, curr) => Math.abs(curr - within) < Math.abs(prev - within) ? curr : prev);
        note = octave * 12 + closest;
    }
    return 440 * Math.pow(2, (note - 69) / 12);
}

function analyseColumn(x) {
    const image = ctx.getImageData(Math.floor(x), 0, 1, canvas.height);
    const data = image.data;
    let sum = 0, weightedY = 0, count = 0;
    for (let y = 0; y < canvas.height; y++) {
        const d = darkness(data, y * 4);
        if (d > 0.08) {
            sum += d;
            weightedY += y * d;
            count++;
        }
    }
    if (sum <= 0.001) return null;
    return { y: weightedY / sum, density: Math.min(1, sum / (canvas.height * 0.12)), pixels: count };
}

function analyseDrawing() {
    const mode = modeSelect.value;
    const samples = Math.max(256, Math.min(1200, Number(binsInput.value) * 5));
    
    // Logique simplifiée unifiée pour la démo
    const frequencies = [], amplitudes = [];
    for (let i = 0; i < samples; i++) {
        const x = i * canvas.width / (samples - 1);
        const col = analyseColumn(x);
        if (!col) {
            frequencies.push(null);
            amplitudes.push(0);
        } else {
            frequencies.push(frequencyFromY(col.y));
            amplitudes.push(Math.min(1, col.density));
        }
    }
    return { frequencies, amplitudes };
}

function ensureAudio() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
}

function waveformSample(phase, waveform) {
    phase = phase - Math.floor(phase);
    if (waveform === "triangle") return 1 - 4 * Math.abs(phase - 0.5);
    if (waveform === "soft") return Math.sin(phase * Math.PI * 2) * 0.82 + Math.sin(phase * Math.PI * 4) * 0.18;
    return Math.sin(phase * Math.PI * 2);
}

function generateAudioBuffer() {
    const duration = Math.max(1, Math.min(60, Number(durationInput.value) || 8));
    const analysis = analyseDrawing();
    if (!analysis || !analysis.amplitudes.some(a => a > 0.01)) return null;

    const ac = ensureAudio();
    const length = Math.floor(duration * ac.sampleRate);
    const buffer = ac.createBuffer(1, length, ac.sampleRate);
    const output = buffer.getChannelData(0);
    const { frequencies, amplitudes } = analysis;
    const waveform = waveformSelect.value;
    const bins = frequencies.length;
    let phase = 0, previousFreq = null;

    for (let i = 0; i < length; i++) {
        const t = i / ac.sampleRate;
        const pos = (t / duration) * (bins - 1);
        const index = Math.min(bins - 1, Math.floor(pos));
        const frac = pos - index;
        const f1 = frequencies[index], f2 = frequencies[Math.min(bins - 1, index + 1)] || f1;
        const a1 = amplitudes[index] || 0, a2 = amplitudes[Math.min(bins - 1, index + 1)] || 0;

        if (f1 === null) {
            output[i] = 0;
            previousFreq = null;
            continue;
        }

        const freq = f1 + (f2 - f1) * frac;
        const amp = a1 + (a2 - a1) * frac;
        previousFreq = previousFreq === null ? freq : previousFreq + (freq - previousFreq) * 0.08;
        phase += previousFreq / ac.sampleRate;

        output[i] = waveformSample(phase, waveform) * amp * 0.8;
    }
    return buffer;
}

async function playAudio() {
    stopAudio();
    status.textContent = "Génération du son…";
    await new Promise(r => setTimeout(r, 10));

    let buffer;
    try { buffer = generateAudioBuffer(); } catch (e) { console.error(e); status.textContent = "Erreur audio."; return; }
    if (!buffer) { status.textContent = "Dessin vide."; return; }

    lastAudioBuffer = buffer;
    const ac = ensureAudio();
    if (ac.state === "suspended") await ac.resume();

    const source = ac.createBufferSource();
    const gain = ac.createGain();
    source.buffer = buffer;
    gain.gain.value = Number(volumeInput.value);
    source.connect(gain);
    gain.connect(ac.destination);

    playbackDuration = buffer.duration;
    currentSource = source;
    source.onended = () => {
        if (currentSource === source) {
            currentSource = null;
            stopReadingAnimation();
            status.textContent = "Lecture terminée.";
        }
    };

    source.start();
    status.textContent = "Lecture en cours…";
    startReadingAnimation();
}

function stopAudio() {
    stopReadingAnimation();
    if (currentSource) {
        try { currentSource.onended = null; currentSource.stop(); } catch (e) {}
        currentSource = null;
    }
}

playBtn.addEventListener("click", playAudio);
playUnderBtn.addEventListener("click", playAudio);
stopBtn.addEventListener("click", () => { stopAudio(); status.textContent = "Arrêté."; });
stopUnderBtn.addEventListener("click", () => { stopAudio(); status.textContent = "Arrêté."; });

/* --- SPECTROGRAMME (Minimal simplifié & fluide) --- */
spectrogramBtn.addEventListener("click", () => {
    if (!lastAudioBuffer) {
        lastAudioBuffer = generateAudioBuffer();
    }
    if (!lastAudioBuffer) {
        status.textContent = "Rien à analyser.";
        return;
    }
    // Simple rendu visuel Waveform pour la modale
    const data = lastAudioBuffer.getChannelData(0);
    const wCtx = waveformCtx;
    wCtx.fillStyle = "#fff";
    wCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
    wCtx.strokeStyle = "#000";
    wCtx.beginPath();
    for (let x = 0; x < waveformCanvas.width; x++) {
        const idx = Math.floor(x * data.length / waveformCanvas.width);
        const y = (1 - data[idx]) * (waveformCanvas.height / 2);
        if (x === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    }
    wCtx.stroke();

    spectrogramModal.classList.add("visible");
    status.textContent = "Spectrogramme ouvert.";
});

closeSpectrogramBtn.addEventListener("click", () => spectrogramModal.classList.remove("visible"));
</script>
</body>
</html>
